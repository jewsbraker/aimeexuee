  .xb { position: absolute; top: 8px; right: 10px; border: 0; background: #ffe0e8; font: 600 13px "Fredoka", sans-serif; color: #b5496b; cursor: pointer; padding: 5px 12px; border-radius: 999px; z-index: 2; }
  .card { position: relative; width: min(400px, 100%); padding: 34px 24px 24px; border-radius: 22px; background: #3a1a5e; border: 3px solid #ffc2d4; color: #fff; text-align: center; box-shadow: 0 20px 60px #000a; animation: slide .6s; }

  /* surat penangkapan */
  .cert { position: relative; width: min(420px, 100%); max-height: 92vh; max-height: 92dvh; overflow: auto; touch-action: pan-y; padding: 40px 18px 22px; text-align: center; color: #222; background: #fffbe8; border: 6px solid #111; box-shadow: 0 20px 60px #000a; animation: slide .8s; }
  .cert::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px; background: repeating-linear-gradient(-45deg, #111 0 14px, #ffd400 14px 28px); }
  .cert > small:first-of-type { padding-right: 64px; }
  .cert .xb { top: 32px; background: #111; color: #ffd400; }

  .cert h2 { font: 400 32px "Anton", Impact, sans-serif; letter-spacing: .05em; color: #c1121f; margin: 2px 0 8px; }
  .mug { position: relative; height: 230px; margin: 8px auto; border: 4px solid #111; background: repeating-linear-gradient(#f1ece0 0 29px, #9c9584 29px 30px); overflow: hidden; }
  .mug .mi { position: absolute; left: 50%; top: 8px; bottom: 50px; width: 58%; transform: translateX(-50%); background: #777; overflow: hidden; }
  .mug .mi img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mug .plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 6px 7px; background: #111; color: #fff; font: 600 15px/1.15 "Fredoka", sans-serif; }

  .vonis { margin: 8px 0; padding: 10px; background: #ffe9a8; border: 2px dashed #111; font: 600 14px/1.35 "Fredoka", sans-serif; }

  .lan { position: fixed; z-index: 5; bottom: -130px; pointer-events: auto; cursor: pointer; animation: lanup var(--t, 16s) linear forwards; }

  @keyframes geter { 0% { transform: translate(-1.5px, 0) rotate(-3deg); } 50% { transform: translate(1.5px, -1px) rotate(3deg); } 100% { transform: translate(-1px, 1px) rotate(-2deg); } }
  .lan .tx { margin: 14px auto 0; width: max-content; max-width: 140px; padding: 6px 12px; border-radius: 14px; background: #1c0e38; border: 2px solid #ffd45a; font: 600 13px/1.3 "Fredoka", sans-serif; color: #fff3d6; box-shadow: 0 0 14px #ffd45a77; }
  @keyframes lanup { to { transform: translateY(-125vh); } }
  @keyframes lsw { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
  #dawn { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 4s ease; background: radial-gradient(ellipse at 50% 118%, #ff7aa84d 0%, transparent 55%), linear-gradient(180deg, #06030d 0%, #120826 50%, #26103f 100%); }
  body.dawn #dawn { opacity: 1; }
  #nw { position: fixed; z-index: 5; left: 0; right: 0; top: 8vh; text-align: center; pointer-events: none; font: 400 clamp(34px, 10vw, 76px)/1.1 "Lilita One", sans-serif; color: #fff; text-shadow: 0 0 24px #ff9a6a; opacity: 0; transition: opacity 2s; }

  @media (max-width: 420px), (max-height: 700px) {

  }
  @media (prefers-reduced-motion: reduce) { .show #t1 span { animation: rise .01s forwards; } #btn.pulse { animation: none; } }
</style>
</head>

     [teks atas, teks bawah]. Ganti sesuai isi fotonya biar makin pecah */

  }
  function textBurst(txt, y) {
    var w = Math.min(W * .92, 560), fs = Math.min(w / (txt.length * .66), 110), c = document.createElement('canvas'), g;
    c.width = w; c.height = Math.ceil(fs * 1.3); g = c.getContext('2d');

    for (var py = 0; py < c.height; py += st) for (var px = 0; px < w; px += st) if (d[(py * c.width + px) * 4 + 3] > 128)
      tparts.push({ x: W / 2 + rnd(-40, 40), y: H + rnd(0, 50), tx: ox + px, ty: oy + py, hold: (110 + rnd(0, 20)) | 0, hue: rnd(38, 55), g: .03, f: .98, life: 1, decay: .014, sz: 2.8, vx: 0, vy: 0 });

  }

    var i;
    for (i = rockets.length - 1; i >= 0; i--) {

  setInterval(function () {
    if (document.hidden) return;
    parts.push({ x: rnd(W * .4, W), y: rnd(0, H * .25), vx: -9, vy: 4.2, g: 0, f: 1, hue: 50, life: 1, decay: .02, sz: 2.6 });
  }, 7000);

  /* tombol bawah terkunci sampai 5 lilin ditiup */
  var locked = true;
  function setLock(on) {

  /* ---------- aksi ---------- */
  var jy = 0, jv = 0, sq = 0, sqv = 0, finaleDone = false, typer = null, dawned = false, opened = false, envT = null, envSoon = false, vel = 0;
  function updateHint() { hint.textContent = got < TOTAL ? 'Tiup 5 lilin dulu ya 🎂 (' + got + ' dari ' + TOTAL + ')' : 'Lilin padam ✨ Pecahin balon, buka kado, tangkap topi pesta!'; }
  setTimeout(function () { title.classList.add('show'); }, 700);
  updateHint(); resize(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  function celebrate(x, y, big) {

    setTimeout(function () { textBurst('SELAMAT', H * .3); }, 700); setTimeout(function () { textBurst('ULTAH ' + NICK.toUpperCase() + '!', H * .3); }, 3000); setTimeout(function () { $('pn').classList.remove('on'); }, 5400);
    setTimeout(function () { title.classList.add('hide'); }, 400); $('btn').classList.add('pulse'); setTimeout(openLetter, 5600);
    updateHint();
  }

  /* combo sentuhan cepat */
  var cmb = 0, cmbT = 0;
  function combo(x, y) {

  }
  function tapCandle(i, x, y) {

    if (!touched[i]) { touched[i] = 1; got++; updateHint(); if (got === TOTAL) finale(); }
  }
  var cakeN = 0;
  function tapCake(x, y) {
    title.classList.add('show');
    [0, 4, 7, 9].forEach(function (n, k) { setTimeout(function () { chime(n); }, k * 110); });
    vel += (Math.random() < .5 ? -1 : 1) * .3;
    if (jy === 0) { jv = .22; sq = -.1; }
    floatWord(CAKE_WORDS[cakeN % CAKE_WORDS.length], x, y - 20);
    burstPetals(x, y, 35, true); launch(Math.max(40, Math.min(W - 40, x)), H * .25); until = performance.now() + 2500; throwCaps(2);
    if (++cakeN % 3 === 0) memeSticker(x, y);
  }
  var balN = 0;
  function popBalloon(i, x, y) {
    var b = balloons[i]; if (b.pop) return; b.pop = true; b.t = performance.now() + 3500; b.k = 0;
    buzz(30); combo(x, y); tone(180, .15, .2, 'square'); tone(90, .25, .2, 'sawtooth'); chime(6 + i);
    floatWord(BALLOON_WORDS[balN++ % BALLOON_WORDS.length], x, y - 20); burstPetals(x, y, 45, true); memeSticker(x, y);
  }
  function tapGift(x, y) { buzz(25); chime(7); burstPetals(x, y, 30, true); launch(Math.max(40, Math.min(W - 40, x)), H * .25); openMeme(); }

  /* tangkap topi yang melayang */
  var caught = 0, lastCap = null;
  function catchCap(x, y) {
    var c = lastCap; if (!c) return; scene.remove(c);
    var k = toss.indexOf(c); if (k >= 0) toss.splice(k, 1);

    floatWord('+1 🥳 (' + caught + ')', x, y - 20); burstPetals(x, y, 10, true);
    if (caught % 10 === 0) {
      celebrate(x, y, true); memeSticker(x, y);
      setTimeout(function () { textBurst(NICK.toUpperCase() + ' JAGOAN', H * .3); }, 600);
      setTimeout(function () { $('pn').classList.remove('on'); }, 3200);
    }
  }

  /* overlay, surat, harapan, perkara, meme */
  var certSeen = false;
  function openOv(id) {
    if (id === 'cert') { certSeen = true; fillMug(); }
    if (id === 'photos') buildGallery();
    $(id).classList.add('open');
  }
  function closeOv(o) {
    o.classList.remove('open');
    if (o.id === 'letter') { clearInterval(typer); typer = null; if (finaleDone && !dawned) { dawned = true; setTimeout(dawn, 600); } }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.ov'), function (o) {
    o.addEventListener('click', function (e) { if (e.target === o || e.target.classList.contains('xb')) closeOv(o); });
  });
  function showEnv() { if (!opened && finaleDone) $('env').classList.add('on'); }
  envT = setTimeout(showEnv, 9000);
  function fitLetter() {
    var p = $('lp'), m = $('msg'), s = $('sig'), small = innerWidth < 420 || innerHeight < 700;
    var fs = small ? 19 : 26, lh = Math.round(fs * 1.3);
    m.textContent = MESSAGE; s.classList.add('on');
    function set() { p.style.setProperty('--fs', fs + 'px'); p.style.setProperty('--lh', lh + 'px'); }
    set();
    while (p.scrollHeight > p.clientHeight + 1 && fs > 15) { fs--; lh = Math.round(fs * 1.3); set(); }
    m.textContent = ''; s.classList.remove('on');
  }
  function openLetter() {
    if (typer) return; opened = true; $('env').classList.remove('on'); $('btn').classList.remove('pulse'); openOv('letter');
    var m = $('msg'), s = $('sig'), i = 0; fitLetter();
    typer = setInterval(function () {

  }
  var lastLane = -1;
  function lanePos() {

  }
  function lantern(txt, delay) {

      var e = document.createElement('div'); e.className = 'lan'; e.style.left = lanePos() + 'px'; e.style.setProperty('--t', rnd(16, 19).toFixed(1) + 's');
      e.innerHTML = '<div class="sw"><div class="bx"></div><div class="tx"></div></div>'; e.querySelector('.tx').textContent = txt;

        var r = e.getBoundingClientRect(); chime(7); buzz(25);

    }, delay || 0);
  }
  function dawn() {
    document.body.classList.add('dawn'); title.classList.add('hide'); setTimeout(function () { title.classList.remove('hide'); }, 9000); $('nw').classList.add('on'); setTimeout(function () { $('nw').classList.remove('on'); }, 7000);
    WISHES.forEach(function (w, i) { lantern(w, 1500 + i * 5200); });
    [0, 4, 7, 9].forEach(function (n, k) { setTimeout(function () { chime(n); }, k * 260); });
  }
  $('btn').addEventListener('click', openLetter); $('env').addEventListener('click', openLetter);
  $('bw').addEventListener('click', function () { openOv('wish'); setTimeout(function () { $('wi').focus(); }, 300); });
  $('bc').addEventListener('click', function () { openOv('cert'); chime(4); });
  $('bm').addEventListener('click', function () { openOv('photos'); chime(6); });
  $('wgo').addEventListener('click', function () {

  $('wi').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('wgo').click(); });

  /* pointer */

  function pick(x, y) {

  });
  addEventListener('pointermove', function (e) {

    for (var sp = 0; sp < 2 && parts.length < 1100; sp++) parts.push({ x: e.clientX, y: e.clientY, vx: rnd(-.6, .6), vy: rnd(-.6, .4), g: .02, f: .95, hue: rnd(38, 55), life: 1, decay: .05, sz: rnd(1.4, 2.4) });

  });

  addEventListener('contextmenu', function (e) { e.preventDefault(); });

      }

  });
  addEventListener('pointerup', function () { clearTimeout(hold); });

  /* papan tersangka bergetar kalau belum dibuka */
  var nudgeT = 0, dv = new THREE.Vector3();
  function nudge(t) {

    bdy.position.y = on ? Math.abs(Math.sin(t * 14)) * .15 : 0;

  /* auto-kualitas */
  var pl = 0, pa = 0, pc2 = 0;
  function perf(now) {
    if (pl) { pa += now - pl; if (++pc2 === 90) { if (!low && pa / 90 > 26) { low = true; MAXP = 120; ren.setPixelRatio(1); ren.setSize(W, H, false); } pa = 0; pc2 = 0; } }
    pl = now;
  }

  /* ---------- loop ---------- */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, T0 = performance.now();
  function ob(x) { if (x <= 0) return 0; if (x >= 1) return 1; var c = 1.70158; x -= 1; return 1 + (c + 1) * x * x * x + c * x * x; }
  function frame(now) {
    perf(now);
    var t = now / 1000, e = (now - T0) / 1000;
    if (!drag) { userRot += vel; vel *= .95; }
    sx += (tx - sx) * .06;
    root.rotation.y = userRot + (reduce ? 0 : Math.sin(t * .5) * .2);
    if (jy > 0 || jv > 0) { jv -= .022; jy += jv; if (jy <= 0) { jy = 0; jv = 0; sq = .26; sqv = 0; } }
    sqv += -sq * .25; sqv *= .82; sq += sqv;

    body.scale.setScalar(Math.max(.001, ob(e / .8)));

    candles.forEach(function (c, i) {
      var want = (now < c.out) ? 0 : 1;
      c.k += (want - c.k) * (want ? .08 : .35);
      var fk = c.k * (1 + Math.sin(t * 20 + c.ph) * .08), sh = Math.max(.001, ob((e - 1.0 - i * .15) / .6));
      c.g.scale.setScalar(sh);
      c.fl.scale.set(Math.max(.001, c.k), Math.max(.001, fk * (1 + Math.sin(t * 31 + c.ph) * .12)), Math.max(.001, c.k));
      c.fl.rotation.z = Math.sin(t * 9 + c.ph) * .12;
    });

    balloons.forEach(function (b, i) {
      if (b.pop && now > b.t) { b.pop = false; b.born = now; }
      var k = b.pop ? 0 : ob((now - b.born) / 700) * (b.born ? 1 : ob((e - 1.2 - i * .2) / .9));
      b.g.scale.setScalar(Math.max(.001, k));
      b.g.position.y = b.y0 + (reduce ? 0 : Math.sin(t * 1.3 + b.ph) * .15); b.g.rotation.z = Math.sin(t * 1.1 + b.ph) * .06;
    });

    var ck = ob((e - 2.4) / .9);
    capW.scale.setScalar(Math.max(.001, .9 * ck));
    capW.position.y = CAPY + (1 - ck) * 4 + (reduce ? 0 : Math.sin(t * 2) * .12);
    capW.rotation.z = Math.sin(t * 1.4) * .1 - sx * .1; cap.rotation.y += .02 + capSpin * .4; capSpin *= .95;

    for (var i = toss.length - 1; i >= 0; i--) {
      var c = toss[i], d = c.userData; d.v.y -= .011; c.position.add(d.v); c.rotation.x += d.r.x; c.rotation.y += d.r.y; c.rotation.z += d.r.z;
      if (c.position.y < -6) { scene.remove(c); toss.splice(i, 1); }
    }
    nudge(t); ren.render(scene, cam); petalStep(t); fxStep(now); tStep();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
