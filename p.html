<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Graduation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Fredoka:wght@500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --rose:#ffc2d4; --gold:#ffe6b0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Fredoka", system-ui, sans-serif; background-color: #25103f;
    background-image:
      radial-gradient(1.6px 1.6px at 14% 16%, #fff9 50%, transparent 52%),
      radial-gradient(1.6px 1.6px at 82% 10%, #fff9 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 44% 26%, #fff8 50%, transparent 52%),
      radial-gradient(1.4px 1.4px at 92% 38%, #fff8 50%, transparent 52%),
      radial-gradient(ellipse at 50% 112%, #e0648f 0%, transparent 60%),
      linear-gradient(180deg, #1c0e38 0%, #4b2060 62%, #7a2f6c 100%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #bk { z-index: 1; } #fx { z-index: 2; } #gl { z-index: 3; pointer-events: auto; } #fr { z-index: 4; }
  #title { position: fixed; z-index: 5; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 5vh); text-align: center; pointer-events: none; padding: 0 12px; }
  #t1 { font-family: "Pinyon Script", cursive; font-size: clamp(50px, 15vw, 112px); line-height: 1.02; color: #fff1cf; }
  #t1 span { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(16px) scale(.94); margin: 0 .08em; }
  .show #t1 span { animation: rise 1.4s var(--d) cubic-bezier(.2,.8,.2,1) forwards, glow 3.2s calc(var(--d) + 1.4s) ease-in-out infinite; }
  #t2 { margin-top: 6px; font-weight: 500; font-size: clamp(15px, 4.2vw, 22px); color: var(--rose); letter-spacing: .03em; opacity: 0; transition: opacity 1.2s 1.1s; text-shadow: 0 0 14px #ff7aa855; }
  .show #t2 { opacity: 1; }
  @keyframes rise { to { opacity: 1; filter: none; transform: none; } }
  @keyframes glow { 0%, 100% { opacity: 1; text-shadow: 0 0 16px #ffc46a99, 0 0 40px #ff7aa866; } 50% { opacity: 1; text-shadow: 0 0 24px #ffd98ccc, 0 0 60px #ff7aa88a; } }
  .ui { position: fixed; z-index: 6; border: 1px solid #ffffff44; background: #ffffff1f; color: #fff; font: 500 15px "Fredoka", sans-serif; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #btn { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 11px 22px; }
  #btn.pulse { animation: pulse 1.6s ease-in-out infinite; background: #ff7aa8aa; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 26px #ff7aa8; } }
  #snd { right: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); width: 42px; height: 42px; font-size: 18px; }
  #hint { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); text-align: center; font-size: 14px; color: var(--gold); pointer-events: none; text-shadow: 0 1px 8px #0008; }
  .word { position: fixed; z-index: 7; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; font: 600 clamp(17px, 4.6vw, 24px) "Fredoka", sans-serif; color: #fff; text-shadow: 0 0 12px #ff5f96, 0 2px 6px #0008; animation: floaty 2s ease-out forwards; }
  @keyframes floaty { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -330%) scale(1); } }
  #letter { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; padding: 22px; background: #14082acc; }
  #letter.open { display: flex; animation: fade .5s; }
  @keyframes fade { from { opacity: 0; } }
  .paper { position: relative; width: min(440px, 100%); max-height: 80vh; overflow: auto; padding: 30px 26px 24px; border-radius: 6px; background: repeating-linear-gradient(#fff8ef 0 33px, #f2dccf 33px 34px); box-shadow: 0 20px 60px #000a; transform: rotate(-1deg); }
  .paper p { font: 600 clamp(21px, 5.6vw, 26px)/34px "Caveat", cursive; color: #5a2a46; white-space: pre-wrap; min-height: 34px; }
  .paper .sig { text-align: right; margin-top: 12px; opacity: 0; transition: opacity 1s; color: #b5496b; }
  .paper .sig.on { opacity: 1; }
  .paper button { position: absolute; top: 8px; right: 10px; border: 0; background: none; font: 500 14px "Fredoka", sans-serif; color: #b5496b; cursor: pointer; padding: 6px; }
  @media (prefers-reduced-motion: reduce) { .show #t1 span { animation: rise .01s forwards; } #btn.pulse { animation: none; } }
</style>
</head>
<body>
<canvas id="bk"></canvas><canvas id="fx"></canvas><canvas id="gl"></canvas><canvas id="fr"></canvas>
<div id="title"><div id="t1"></div><div id="t2"></div></div>
<div id="hint"></div>
<button class="ui" id="snd" aria-label="Suara">🔔</button>
<button class="ui" id="btn">✉️ Pesan untukmu</button>
<div id="letter" class="ui"><div class="paper"><button id="x">Tutup</button><p id="msg"></p><p class="sig" id="sig"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  /* ===== UBAH BAGIAN INI SESUKA HATI ===== */
  var NAME = 'Anastasia Aime Widjadja';
  var FROM = 'Salam hangat,';
  var MESSAGE = 'Perjalanan ini nggak mudah. Ada malam-malam begadang, ada hari-hari yang melelahkan, dan ada saat-saat kamu hampir menyerah. Tapi kamu tetap melangkah.\n\nHari ini semua itu terbayar. Kamu pantas banget bangga sama dirimu sendiri.\n\nSelamat wisuda, Anastasia! Semoga langkah-langkah berikutnya penuh hal baik.';
  var WORDS = ['Selamat ya!', 'Kamu hebat', 'Kerja kerasmu terbayar', 'Akhirnya wisuda!', 'Kamu keren banget', 'Semangat terus ya', 'Bangga sama kamu', 'Dunia menunggumu', 'Semoga sukses selalu', 'Selamat, Sarjana VCD'];
  /* ======================================= */

  var $ = function (i) { return document.getElementById(i); };
  var hint = $('hint'), title = $('title');
  if (!window.THREE) { hint.textContent = 'Buka dengan internet ya, supaya buket 3D-nya bisa muncul'; return; }
  var rnd = function (a, b) { return a + Math.random() * (b - a); }, D = Math.PI / 180;
  var cb = $('bk').getContext('2d'), cx = $('fx').getContext('2d'), cf = $('fr').getContext('2d');
  var W = 0, H = 0, dpr = 1, TOTAL = 10, got = 0, touched = {};

  /* judul */
  [['Happy', 0], ['Graduation', 350]].forEach(function (w) {
    var s = document.createElement('span'); s.textContent = w[0]; s.style.setProperty('--d', w[1] + 'ms'); $('t1').appendChild(s);
  });
  $('t2').textContent = 'Selamat atas kelulusanmu, ' + NAME;
  $('sig').textContent = FROM;

  /* ---------- suara ---------- */
  var AC = null, snd = true, SC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 2093];
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
  function tone(f, d, v, ty) {
    if (!snd) return; var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = ty || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
  }
  function chime(i) { tone(SC[i % 10], 1.1, .13); tone(SC[i % 10] * 2, .6, .035, 'triangle'); }
  $('snd').addEventListener('click', function () { snd = !snd; this.textContent = snd ? '🔔' : '🔕'; });

  /* ---------- Three.js ---------- */
  var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, 1, .1, 100);
  var ren = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
  ren.setClearColor(0x000000, 0);
  scene.add(new THREE.HemisphereLight(0xfff2ea, 0x8a5a9a, .95));
  var sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(4, 9, 7); scene.add(sun);
  var rim = new THREE.DirectionalLight(0xff9ec8, .55); rim.position.set(-6, 4, -6); scene.add(rim);

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    ren.setPixelRatio(dpr); ren.setSize(W, H, false);
    ['bk', 'fx', 'fr'].forEach(function (k) { $(k).width = W * dpr; $(k).height = H * dpr; });
    [cb, cx, cf].forEach(function (c) { c.setTransform(dpr, 0, 0, dpr, 0, 0); });
    cam.aspect = W / H;
    var t = Math.tan(cam.fov * Math.PI / 360), d = Math.max(4.9 / t, 3.4 / (t * cam.aspect)) * 1.1;
    cam.position.set(0, 5.2, d); cam.lookAt(0, 4.3, 0); cam.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  var mats = {};
  function M(c) { return mats[c] || (mats[c] = new THREE.MeshStandardMaterial({ color: c, roughness: .4, metalness: 0 })); }
  var studG = new THREE.CylinderGeometry(.17, .17, .12, 14), PET = new THREE.SphereGeometry(1, 10, 8);
  function stud(c, x, y, z, p) { var m = new THREE.Mesh(studG, M(c)); m.position.set(x, y, z); p.add(m); return m; }
  function box(w, h, d, c, x, y, z, p) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y, z); p.add(m); return m; }
  function cyl(r, h, c, x, y, z, p, s) { var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, s || 12), M(c)); m.position.set(x, y, z); p.add(m); return m; }

  var root = new THREE.Group(), bq = new THREE.Group(), body = new THREE.Group();
  scene.add(root); root.add(bq); bq.add(body);

  /* baseplate bulat + plakat nama */
  cyl(2.6, .3, '#cdd9bd', 0, -.15, 0, root, 64);
  for (var gx = 0; gx < 7; gx++) for (var gz = 0; gz < 7; gz++) {
    var px = (gx - 3) * .8, pz = (gz - 3) * .8, r = Math.hypot(px, pz);
    if (r > .8 && r < 2.25) stud('#dfe9d0', px, .06, pz, root);
  }
  var pc = document.createElement('canvas'); pc.width = 512; pc.height = 170;
  var pt = new THREE.CanvasTexture(pc);
  function plaque() {
    var g = pc.getContext('2d'); g.fillStyle = '#fff6ee'; g.fillRect(0, 0, 512, 170);
    g.strokeStyle = '#e8a6b8'; g.lineWidth = 6; g.strokeRect(10, 10, 492, 150);
    g.textAlign = 'center'; g.fillStyle = '#b5496b'; var fs = 56; g.font = '600 56px Fredoka, sans-serif';
    while (g.measureText(NAME).width > 440 && fs > 20) { fs -= 2; g.font = '600 ' + fs + 'px Fredoka, sans-serif'; }
    g.fillText(NAME, 256, 88);
    g.fillStyle = '#d98ca0'; g.font = '500 32px Fredoka, sans-serif'; g.fillText('Selamat wisuda', 256, 136); pt.needsUpdate = true;
  }
  plaque(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(plaque);
  var pg = new THREE.Group(); pg.position.set(0, .5, 2.05); pg.rotation.x = -.5; root.add(pg);
  pg.add(new THREE.Mesh(new THREE.PlaneGeometry(2.1, .7), new THREE.MeshBasicMaterial({ map: pt })));
  box(2.18, .78, .05, '#fff6ee', 0, 0, -.04, pg);

  /* kertas pembungkus + pita */
  function cone(rt, rb, h, c, y) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 8, 1, true), new THREE.MeshStandardMaterial({ color: c, roughness: .6, flatShading: true, side: THREE.DoubleSide }));
    m.position.y = y; body.add(m);
  }
  cone(1.6, .45, 3, '#f8eadc', 1.5); cone(1.53, .42, 2.96, '#f4b6c4', 1.5);
  var RB = '#d9788f', band = new THREE.Mesh(new THREE.CylinderGeometry(.975, .935, .24, 8, 1, true), new THREE.MeshStandardMaterial({ color: RB, roughness: .25, side: THREE.DoubleSide }));
  band.position.y = 1.2; body.add(band);
  [-1, 1].forEach(function (s) {
    var l = new THREE.Mesh(new THREE.TorusGeometry(.2, .06, 10, 22), M(RB)); l.scale.set(1, .85, .8); l.position.set(s * .24, 1.22, .99); l.rotation.z = s * .35; body.add(l);
    var t = box(.1, .5, .03, RB, s * .09, .9, 1.0, body); t.rotation.z = s * .2;
  });
  var kn = new THREE.Mesh(PET, M('#c4607a')); kn.scale.setScalar(.1); kn.position.set(0, 1.22, 1.01); body.add(kn);
  var hs = new THREE.Shape(); hs.moveTo(0, -.2); hs.bezierCurveTo(-.3, .05, -.2, .28, 0, .14); hs.bezierCurveTo(.2, .28, .3, .05, 0, -.2);
  var tag = new THREE.Group(); tag.position.set(.3, 1.12, .93); body.add(tag);
  box(.02, .3, .02, '#f3d9a4', 0, -.15, 0, tag);
  var hm = new THREE.Mesh(new THREE.ExtrudeGeometry(hs, { depth: .06, bevelEnabled: false }), M('#e8738f')); hm.position.set(0, -.5, 0); tag.add(hm);

  /* bunga */
  var hit = [], flowers = [], sway = [], UP = new THREE.Vector3(0, 1, 0);
  function petal(par, c, a, r0, tilt, len, th, w) {
    var g = new THREE.Group(); g.rotation.y = -a; var m = new THREE.Mesh(PET, M(c));
    m.scale.set(len, th, w); m.position.set(r0 + Math.cos(tilt) * len, Math.sin(tilt) * len, 0); m.rotation.z = tilt; g.add(m); par.add(g); return m;
  }
  var T = {
    rose: [[5, .05, 82, .26, .08, .2, 0, 0], [7, .12, 66, .34, .08, .25, 0, .3], [9, .2, 46, .42, .08, .3, 1, 0], [11, .28, 24, .46, .07, .31, 1, .2]],
    tulip: [[3, .08, 80, .5, .1, .24, 0, 0], [3, .1, 72, .5, .1, .26, 1, .9]],
    daisy: [[14, .18, 6, .42, .04, .1, 0, 0]]
  };
  function bloom(head, type, c) {
    T[type].forEach(function (r) { for (var k = 0; k < r[0]; k++) petal(head, c[r[6]], k * 6.2832 / r[0] + r[7], r[1], r[2] * D, r[3], r[4], r[5]); });
    if (type === 'daisy') { var d = new THREE.Mesh(PET, M('#ffcf4a')); d.scale.set(.2, .1, .2); head.add(d); stud('#ffe07a', 0, .1, 0, head); }
  }
  function orient(th, ph) {
    var g = new THREE.Group();
    g.quaternion.setFromUnitVectors(UP, new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph))); return g;
  }
  function flower(th, ph, L, type, c, size) {
    var i = flowers.length, o = new THREE.Group(); o.position.set(rnd(-.15, .15), 2.7, rnd(-.15, .15)); bq.add(o);
    var inn = orient(th * D, ph * D); o.add(inn);
    cyl(.05, L, '#5f9b6e', 0, L / 2, 0, inn, 8);
    var head = new THREE.Group(); head.position.y = L; head.scale.setScalar(size); inn.add(head); bloom(head, type, c);
    head.traverse(function (m) { if (m.isMesh) { m.userData.fi = i; hit.push(m); } });
    flowers.push({ o: o, ph: rnd(0, 6.28), amp: rnd(.02, .045), pp: 0, pv: 0, w: 0, d: .9 + i * .17 });
  }
  flower(0, 0, 3.4, 'rose', ['#e8789f', '#f7b3c8'], 1.25);
  flower(20, 0, 2.8, 'daisy', ['#ffffff'], 1.15);
  flower(20, 120, 2.8, 'rose', ['#f2a47a', '#fbd0b4'], 1.05);
  flower(20, 240, 2.8, 'tulip', ['#ff7b6b', '#ffa093'], 1.15);
  flower(38, 60, 2.1, 'tulip', ['#f4c542', '#ffe28a'], 1.1);
  flower(38, 150, 2.2, 'rose', ['#c93a5c', '#e5708b'], 1);
  flower(38, 240, 2.1, 'daisy', ['#ffffff'], 1);
  flower(38, 330, 2.2, 'rose', ['#b08be0', '#d9c2f5'], 1.05);
  flower(50, 100, 1.55, 'daisy', ['#ffe7a3'], .9);

  function sprig(th, ph, L, kind) {
    var o = new THREE.Group(); o.position.set(rnd(-.2, .2), 2.7, rnd(-.2, .2)); bq.add(o);
    var inn = orient(th * D, ph * D); o.add(inn); cyl(.035, L, '#6c9c78', 0, L / 2, 0, inn, 6);
    for (var k = 0; k < 9; k++) {
      var m = new THREE.Mesh(PET, M(kind ? ['#9b7fd1', '#b9a1e8'][k % 2] : ['#9fbfa8', '#b4cfb9'][k % 2]));
      if (kind) { m.scale.set(.07, .1, .07); m.position.set((k % 2 ? 1 : -1) * .05, L * .6 + k * .09, 0); }
      else { m.scale.set(.2, .035, .2); m.position.set((k % 2 ? 1 : -1) * .14, L * .3 + k * (L * .075), 0); m.rotation.set(rnd(-.5, .5), 0, (k % 2 ? 1 : -1) * .5); }
      inn.add(m);
    }
    sway.push({ o: o, ph: rnd(0, 6.28) });
  }
  [[28, 30, 2.5, 1], [28, 210, 2.5, 1], [44, 100, 1.8, 1], [44, 290, 1.9, 1], [30, 80, 2.4, 0], [30, 260, 2.4, 0], [46, 20, 1.8, 0], [46, 190, 1.8, 0]].forEach(function (s) { sprig(s[0], s[1], s[2], s[3]); });
  var lg = new THREE.Group(); lg.position.set(0, 2.85, 0); bq.add(lg);
  for (var l = 0; l < 8; l++) petal(lg, l % 2 ? '#6fa383' : '#82b595', l * 6.2832 / 8 + .2, .25, rnd(25, 50) * D, .85, .05, .28);

  /* topi wisuda melayang */
  var cap = new THREE.Group();
  cyl(.42, .3, '#2d2a6e', 0, .2, 0, cap, 16);
  box(1.5, .1, 1.5, '#2d2a6e', 0, .42, 0, cap).rotation.y = Math.PI / 4;
  cyl(.08, .1, '#ffd54a', 0, .51, 0, cap); box(.05, .5, .05, '#ffd54a', 1.0, .17, 0, cap); box(.13, .15, .13, '#ffd54a', 1.0, -.1, 0, cap);
  var capW = new THREE.Group(); capW.add(cap); bq.add(capW);
  cap.traverse(function (m) { if (m.isMesh) { m.userData.fi = 9; hit.push(m); } });
  var CAPY = 7.7, capSpin = 0;

  /* topi lempar */
  var toss = [];
  function throwCaps(n) {
    for (var i = 0; i < n; i++) {
      var c = cap.clone(); c.scale.setScalar(.5); c.position.set(rnd(-1, 1), 4, rnd(-1, 1));
      c.userData = { v: new THREE.Vector3(rnd(-.09, .09), rnd(.28, .42), rnd(-.04, .06)), r: new THREE.Vector3(rnd(-.1, .1), rnd(-.12, .12), rnd(-.1, .1)) };
      c.traverse(function (m) { m.userData.fi = -2; }); scene.add(c); toss.push(c);
    }
  }

  /* ---------- kelopak & bokeh 2D ---------- */
  var PC = ['#ffc2d4', '#ff9fbd', '#ffe0e8', '#ffd7b8', '#f7a8d0', '#ffffff'], wind = 0, P = [], BK = [];
  function newP(burst, x, y) {
    var z = rnd(.15, 1);
    return {
      x: x === undefined ? rnd(0, W) : x, y: y === undefined ? rnd(-20, H) : y, z: z, ph: rnd(0, 6.28), rot: rnd(0, 6.28), vr: rnd(-.04, .04), fl: rnd(0, 6.28), vf: rnd(.02, .07),
      col: PC[(Math.random() * PC.length) | 0], h: burst && Math.random() < .3, life: burst ? 240 : -1,
      bx: burst ? rnd(-4, 4) : 0, by: burst ? rnd(-9, -1) : 0
    };
  }
  for (var i = 0; i < (innerWidth < 600 ? 50 : 85); i++) P.push(newP(false));
  for (var b = 0; b < 9; b++) BK.push({ x: rnd(0, 1), y: rnd(0, 1), r: rnd(30, 90), v: rnd(.00003, .0001), c: ['255,150,190', '255,214,140', '200,160,255'][b % 3] });
  function burstPetals(x, y, n, hearts) {
    for (var i = 0; i < n; i++) { var p = newP(true, x + rnd(-20, 20), y + rnd(-20, 20)); if (hearts) p.h = Math.random() < .6; p.z = Math.max(p.z, .3); P.push(p); }
  }
  function drawP(c, p) {
    var s = 4 + p.z * 10; if (p.z > .82) s *= 1.25;
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(.25 + .75 * Math.abs(Math.cos(p.fl)), 1);
    c.globalAlpha = p.z > .82 ? .75 : .35 + p.z * .55; c.fillStyle = p.col; c.beginPath();
    if (p.h) { c.moveTo(0, s * .45); c.bezierCurveTo(-s * 1.1, -s * .3, -s * .4, -s * 1.05, 0, -s * .35); c.bezierCurveTo(s * .4, -s * 1.05, s * 1.1, -s * .3, 0, s * .45); }
    else { c.moveTo(0, -s); c.bezierCurveTo(s * .9, -s * .6, s * .7, s * .6, 0, s); c.bezierCurveTo(-s * .7, s * .6, -s * .9, -s * .6, 0, -s); }
    c.fill(); c.restore();
  }
  function petalStep(t) {
    cb.clearRect(0, 0, W, H); cf.clearRect(0, 0, W, H);
    BK.forEach(function (k) {
      k.y -= k.v * 16; if (k.y < -.2) k.y = 1.2;
      var g = cb.createRadialGradient(k.x * W, k.y * H, 0, k.x * W, k.y * H, k.r);
      g.addColorStop(0, 'rgba(' + k.c + ',.16)'); g.addColorStop(1, 'rgba(' + k.c + ',0)'); cb.fillStyle = g;
      cb.beginPath(); cb.arc(k.x * W, k.y * H, k.r, 0, 6.2832); cb.fill();
    });
    wind *= .97;
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i];
      p.bx *= .965; p.by *= .965;
      p.y += (.45 + p.z * .9) + p.by; p.x += Math.sin(t * .8 + p.ph) * .5 * (.4 + p.z) + wind * p.z + p.bx; p.rot += p.vr; p.fl += p.vf;
      if (p.life > 0 && --p.life === 0) { P.splice(i, 1); continue; }
      if (p.y > H + 30) { if (p.life > 0) { P.splice(i, 1); continue; } p.y = -30; p.x = rnd(0, W); }
      if (p.x < -50) p.x = W + 50; else if (p.x > W + 50) p.x = -50;
      drawP(p.z > .82 ? cf : cb, p);
    }
  }

  /* ---------- kembang api ---------- */
  var rockets = [], parts = [], until = 0, lastAuto = 0;
  function launch(x, ty) { rockets.push({ x: x, y: H, vy: -Math.sqrt(2 * .16 * (H - ty)), hue: rnd(0, 360) }); }
  function explode(x, y, hue) {
    var heart = Math.random() < .35, n = heart ? 64 : 70 + ((Math.random() * 40) | 0), i;
    if (Math.random() < .5) tone(rnd(80, 120), .45, .045);
    for (i = 0; i < n; i++) {
      var p;
      if (heart) { var t = i / n * 6.2832; p = { vx: 16 * Math.pow(Math.sin(t), 3) * .26, vy: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * .26, hue: rnd(325, 350), g: .02, f: .975 }; }
      else { var a = Math.random() * 6.2832, s = rnd(1, 5.2); p = { vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: hue + rnd(-25, 25), g: .045, f: .985 }; }
      p.x = x; p.y = y; p.life = 1; p.decay = rnd(.008, .014); p.sz = rnd(1.6, 2.8); parts.push(p);
    }
  }
  function fxStep(now) {
    cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = 'rgba(0,0,0,.22)'; cx.fillRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
    if (now < until && now - lastAuto > 480) { lastAuto = now; launch(rnd(W * .1, W * .9), rnd(H * .12, H * .45)); }
    var i;
    for (i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i]; r.vy += .16; r.y += r.vy;
      cx.fillStyle = 'hsl(' + r.hue + ',100%,80%)'; cx.beginPath(); cx.arc(r.x, r.y, 2.2, 0, 6.2832); cx.fill();
      if (r.vy >= -.6) { explode(r.x, r.y, r.hue); rockets.splice(i, 1); }
    }
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.vx *= p.f; p.vy = p.vy * p.f + p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      cx.fillStyle = 'hsla(' + p.hue + ',100%,' + (58 + p.life * 20) + '%,' + p.life + ')';
      cx.beginPath(); cx.arc(p.x, p.y, p.sz * (.5 + p.life * .6), 0, 6.2832); cx.fill();
    }
    cx.globalCompositeOperation = 'source-over';
  }

  /* ---------- aksi ---------- */
  var jy = 0, jv = 0, sq = 0, sqv = 0, finaleDone = false, typer = null;
  function updateHint() { hint.textContent = got < TOTAL ? 'Sentuh bunganya satu per satu (' + got + ' dari ' + TOTAL + ')' : 'Semua sudah kamu sentuh ✨'; }
  updateHint();
  function celebrate(x, y, big) {
    title.classList.add('show'); tone(98, .6, .09);
    launch(Math.max(40, Math.min(W - 40, x)), Math.max(H * .12, Math.min(y * .7, H * .45)));
    for (var i = 1; i < (big ? 12 : 5); i++) (function (d) { setTimeout(function () { launch(rnd(W * .1, W * .9), rnd(H * .1, H * .45)); }, d * 190); })(i);
    until = performance.now() + (big ? 9000 : 5000);
    burstPetals(x, y, big ? 110 : 45, true); throwCaps(big ? 8 : 3);
    if (jy === 0) { jv = .26; sq = -.12; }
  }
  function floatWord(txt, x, y) {
    var e = document.createElement('div'); e.className = 'word'; e.textContent = txt;
    e.style.left = Math.max(80, Math.min(W - 80, x)) + 'px'; e.style.top = y + 'px'; document.body.appendChild(e);
    setTimeout(function () { e.remove(); }, 2100);
  }
  function finale() {
    if (finaleDone) return; finaleDone = true; celebrate(W / 2, H * .5, true);
    [0, 2, 4, 5, 7, 9].forEach(function (n, k) { setTimeout(function () { chime(n); }, 300 + k * 200); });
    $('btn').classList.add('pulse'); setTimeout(openLetter, 4200);
  }
  function tapTarget(i, x, y) {
    if (i < 9) { var f = flowers[i]; f.pv = .2; f.w = 1; } else capSpin = 1;
    chime(i); floatWord(WORDS[i], x, y - 20); burstPetals(x, y, 12, i % 3 === 0);
    if (!touched[i]) { touched[i] = 1; got++; updateHint(); if (got === TOTAL) finale(); }
  }

  /* surat */
  function openLetter() {
    if (typer) return; $('letter').classList.add('open'); $('btn').classList.remove('pulse');
    var m = $('msg'), s = $('sig'), i = 0; m.textContent = ''; s.classList.remove('on');
    typer = setInterval(function () {
      m.textContent = MESSAGE.slice(0, ++i);
      if (i === 1 || i % 12 === 0) tone(SC[(i / 12 | 0) % 5] / 2, .5, .03, 'triangle');
      if (i >= MESSAGE.length) { clearInterval(typer); s.classList.add('on'); }
    }, 32);
    $('letter').onclick = function (e) { if (e.target.id === 'x' || e.target === $('letter')) closeLetter(); else { clearInterval(typer); m.textContent = MESSAGE; s.classList.add('on'); } };
  }
  function closeLetter() { clearInterval(typer); typer = null; $('letter').classList.remove('open'); }
  $('btn').addEventListener('click', openLetter);

  /* pointer */
  var rc = new THREE.Raycaster(), v2 = new THREE.Vector2();
  function pick(x, y) { v2.set(x / W * 2 - 1, -(y / H) * 2 + 1); rc.setFromCamera(v2, cam); var h = rc.intersectObjects(hit, false); return h.length ? h[0].object.userData.fi : -1; }
  var drag = false, moved = 0, lastX = 0, userRot = 0, vel = 0, tx = 0, sx = 0, mx = 0, canvasEl = $('gl');
  canvasEl.addEventListener('pointerdown', function (e) { drag = true; moved = 0; lastX = e.clientX; vel = 0; ac(); });
  addEventListener('pointermove', function (e) {
    tx = (e.clientX / W - .5) * 2; wind = Math.max(-6, Math.min(6, wind + (e.clientX - mx) * .04)); mx = e.clientX;
    if (!drag) return; var dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx); vel = dx * .012; userRot += vel;
  });
  function end(e) {
    if (!drag) return; drag = false;
    if (e.type === 'pointerup' && moved < 10) { var i = pick(e.clientX, e.clientY); if (i >= 0) tapTarget(i, e.clientX, e.clientY); else celebrate(e.clientX, e.clientY, false); }
  }
  addEventListener('pointerup', end); addEventListener('pointercancel', end);
  addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- loop ---------- */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, T0 = performance.now();
  function ob(x) { if (x <= 0) return 0; if (x >= 1) return 1; var c = 1.70158; x -= 1; return 1 + (c + 1) * x * x * x + c * x * x; }
  function frame(now) {
    var t = now / 1000, e = (now - T0) / 1000;
    if (!drag) { userRot += vel; vel *= .95; }
    sx += (tx - sx) * .06;
    root.rotation.y = userRot + (reduce ? 0 : Math.sin(t * .5) * .2);
    if (jy > 0 || jv > 0) { jv -= .022; jy += jv; if (jy <= 0) { jy = 0; jv = 0; sq = .26; sqv = 0; } }
    sqv += -sq * .25; sqv *= .82; sq += sqv;
    bq.position.y = jy + (reduce ? 0 : Math.sin(t * 1.8) * .04); bq.scale.set(1 + sq * .5, 1 - sq, 1 + sq * .5);
    body.scale.setScalar(Math.max(.001, ob(e / .8)));
    tag.rotation.z = Math.sin(t * 1.6) * .14;

    flowers.forEach(function (f) {
      f.pv += -f.pp * .2; f.pv *= .85; f.pp += f.pv; f.w *= .94;
      f.o.scale.setScalar(Math.max(.001, ob((e - f.d) / .9) * (1 + f.pp)));
      f.o.rotation.x = Math.sin(t * 1.3 + f.ph) * f.amp; f.o.rotation.z = Math.cos(t * 1.1 + f.ph) * f.amp - sx * .05; f.o.rotation.y = Math.sin(t * 30) * f.w * .15;
    });
    sway.forEach(function (s) {
      var k = Math.max(.001, ob((e - .8) / .9)); s.o.scale.setScalar(k);
      s.o.rotation.x = Math.sin(t * 1.5 + s.ph) * .05; s.o.rotation.z = Math.cos(t * 1.3 + s.ph) * .05 - sx * .06;
    });
    lg.scale.setScalar(Math.max(.001, ob((e - .6) / .8)));
    var ck = ob((e - 2.8) / .9);
    capW.scale.setScalar(Math.max(.001, .85 * ck));
    capW.position.y = CAPY + (1 - ck) * 4 + (reduce ? 0 : Math.sin(t * 2) * .12);
    capW.rotation.z = Math.sin(t * 1.4) * .08 - sx * .1; cap.rotation.y += capSpin * .4; capSpin *= .95;

    for (var i = toss.length - 1; i >= 0; i--) {
      var c = toss[i], d = c.userData; d.v.y -= .011; c.position.add(d.v); c.rotation.x += d.r.x; c.rotation.y += d.r.y; c.rotation.z += d.r.z;
      if (c.position.y < -6) { scene.remove(c); toss.splice(i, 1); }
    }
    ren.render(scene, cam); petalStep(t); fxStep(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
