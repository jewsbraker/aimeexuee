<style>
/* ===== Dasar global (token sama dengan :root di layouts/app & layouts/admin) ===== */
:root{--black:#0A0A08;--off-white:#F2EFE6;--cream:#E8E3D6;--surface:#111110;--surface-2:#181816;--orange:#E8521A;--orange-dark:#C03F0E;--orange-light:#FF6B35;--gray-mid:#888880;--gray-light:#C8C4B8;--green:#2ECC71;--red:#E74C3C;--font-display:'Bebas Neue',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'Space Mono',monospace;--border:rgba(242,239,230,0.08);--text-main:#F2EFE6;--text-muted:#888880}
html,body{margin:0;padding:0;background:#0A0A08;color:#F2EFE6}
body{font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* ===================================================================
   CSS ASLI dari resources/views/**  (setiap blok diberi prefix kelas
   halaman, mis. .pg-cart, supaya tidak bentrok saat digabung)
   =================================================================== */
/* ===== layouts/app.blade.php  →  .shop ===== */
.shop *,.shop *::before,.shop *::after{margin: 0; padding: 0; box-sizing: border-box;}
.shop{--black: #0A0A08; --off-white: #F2EFE6; --cream: #E8E3D6; --surface: #111110; --surface-2: #181816; --orange: #E8521A; --orange-dark: #C03F0E; --orange-light: #FF6B35; --gray-mid: #888880; --gray-light: #C8C4B8; --green: #2ECC71; --red: #E74C3C; --font-display: 'Bebas Neue', sans-serif; --font-body: 'DM Sans', sans-serif; --font-mono: 'Space Mono', monospace;}
.shop{scroll-behavior: smooth;}
.shop{background: var(--black); color: var(--off-white); font-family: var(--font-body); font-size: 15px; line-height: 1.6; min-height: 100vh;}
.shop a{color: inherit; text-decoration: none;}
.shop button{font-family: inherit;}
.shop .nav{position: sticky; top: 0; z-index: 200; height: 64px; background: rgba(10,10,8,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(242,239,230,0.07); display: flex; align-items: center; padding: 0 4rem; gap: 1.5rem;}
.shop .nav-logo{font-family: var(--font-display); font-size: 1.7rem; letter-spacing: 0.04em; color: var(--off-white); flex-shrink: 0;}
.shop .nav-logo span{color: var(--orange);}
.shop .nav-search{flex: 1; max-width: 440px; display: flex; align-items: center; background: var(--surface); border: 1px solid rgba(242,239,230,0.1); border-radius: 3px; overflow: hidden;}
.shop .nav-search input{flex: 1; padding: 0.55rem 1rem; background: transparent; border: none; color: var(--off-white); font-family: var(--font-body); font-size: 0.85rem; outline: none;}
.shop .nav-search input::placeholder{color: var(--gray-mid);}
.shop .nav-search-btn{padding: 0.55rem 1rem; background: var(--orange); border: none; color: var(--off-white); cursor: pointer; display: flex; align-items: center;}
.shop .nav-search-btn svg{width: 16px; height: 16px;}
.shop .nav-spacer{flex: 1;}
.shop .nav-icons{display: flex; align-items: center; gap: 0.25rem;}
.shop .nav-icon-btn{width: 40px; height: 40px; border-radius: 3px; background: transparent; border: none; color: var(--gray-light); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.2s;}
.shop .nav-icon-btn:hover{background: var(--surface); color: var(--off-white);}
.shop .nav-icon-btn svg{width: 20px; height: 20px;}
.shop .nav-badge{position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--orange); color: var(--off-white); font-size: 9px; font-weight: 700; font-family: var(--font-mono); display: flex; align-items: center; justify-content: center;}
.shop .nav-avatar{width: 34px; height: 34px; border-radius: 50%; background: #2A2A26; border: 1.5px solid rgba(232,82,26,0.4); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700; color: var(--orange); cursor: pointer; flex-shrink: 0; transition: border-color 0.2s;}
.shop .page-wrapper{max-width: 1320px; margin: 0 auto; padding: 2rem 4rem 4rem;}
.shop .breadcrumb{display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--gray-mid); margin-bottom: 2rem; font-family: var(--font-mono); letter-spacing: 0.04em; flex-wrap: wrap;}
.shop .breadcrumb span{color: var(--orange);}
.shop .btn{display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.5rem; border-radius: 2px; font-family: var(--font-body); font-size: 0.87rem; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; border: none; transition: all 0.2s;}
.shop .btn-primary{background: var(--orange); color: var(--off-white);}
.shop .btn-primary:hover{background: var(--orange-light);}
.shop .btn-outline{background: transparent; color: var(--off-white); border: 1px solid rgba(242,239,230,0.2);}

.shop .btn-sm{padding: 0.45rem 1rem; font-size: 0.78rem;}
.shop .btn-lg{padding: 0.9rem 2.5rem; font-size: 0.95rem;}
.shop .badge{display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 2px; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;}
.shop .badge-orange{background: var(--orange); color: var(--off-white);}
.shop .badge-green{background: rgba(46,204,113,0.15); color: var(--green); border: 1px solid rgba(46,204,113,0.2);}
.shop .sec-label{display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); margin-bottom: 0.75rem;}
.shop .sec-label::before{content: ''; width: 16px; height: 1px; background: var(--orange);}
.shop .sec-title{font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 0.03em; line-height: 1; margin-bottom: 2rem;}
.shop .nav-icon-wrapper{position: relative; display: inline-block;}

.shop .notif-drop-header{padding: 1rem; border-bottom: 1px solid rgba(242, 239, 230, 0.06); font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.05em; color: var(--off-white); display: flex; justify-content: space-between; align-items: center;}
.shop .notif-drop-list{max-height: 280px; overflow-y: auto;}

.shop .footer-mini{border-top: 1px solid rgba(242,239,230,0.06); padding: 2rem; text-align: center; font-size: 0.75rem; color: var(--gray-mid); font-family: var(--font-mono); letter-spacing: 0.06em;}
.shop .hero{min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; position: relative; overflow: hidden;}
.shop .hero-bg-text{position: absolute; bottom: -2rem; left: -1rem; font-family: var(--font-display); font-size: clamp(8rem, 18vw, 22rem); color: rgba(232,82,26,0.04); letter-spacing: -0.02em; user-select: none; pointer-events: none; white-space: nowrap;}
.shop .hero-left{display: flex; flex-direction: column; justify-content: center; padding: 6rem 3rem 6rem 4rem; position: relative; z-index: 1;}
.shop .hero-eyebrow{display: inline-flex; align-items: center; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); margin-bottom: 1.5rem;}
.shop .hero-eyebrow::before{content: ''; display: block; width: 24px; height: 1px; background: var(--orange);}
.shop .hero-title{font-family: var(--font-display); font-size: clamp(4.5rem, 7vw, 8rem); line-height: 0.92; letter-spacing: 0.01em; margin-bottom: 2rem;}
.shop .hero-title .accent{color: var(--orange);}
.shop .hero-sub{font-size: 1.05rem; line-height: 1.7; color: var(--gray-light); max-width: 380px; margin-bottom: 3rem;}
.shop .hero-actions{display: flex; gap: 1rem; align-items: center;}
.shop .hero-link{color: var(--gray-light); text-decoration: none; font-size: 0.9rem; font-weight: 500; border-bottom: 1px solid rgba(200,196,184,0.3); padding-bottom: 2px; transition: all 0.2s;}
.shop .hero-link:hover{color: var(--off-white); border-color: var(--off-white);}
.shop .hero-stats{display: flex; gap: 3rem; margin-top: 4rem; padding-top: 2.5rem; border-top: 1px solid rgba(242,239,230,0.1);}
.shop .hero-stat-num{font-family: var(--font-display); font-size: 2.2rem; color: var(--off-white); letter-spacing: 0.02em;}
.shop .hero-stat-label{font-size: 0.75rem; color: var(--gray-mid); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.2rem;}

.shop .hero-image-block{width: 100%; background: #141410; position: relative; overflow: hidden;}

.shop .hero-engine-svg{width: 100%; height: 100%; object-fit: cover; opacity: 0.7;}
.shop .hero-badge{position: absolute; top: 2.5rem; left: -1rem; background: var(--orange); color: var(--off-white); padding: 0.6rem 1.2rem 0.6rem 2rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; z-index: 2;}
.shop .hero-ticker{position: absolute; bottom: 2rem; left: 2rem; right: 2rem; z-index: 2;}
.shop .ticker-label{font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-mid); margin-bottom: 0.5rem;}

.shop .marquee-wrap{border-top: 1px solid rgba(242,239,230,0.08); border-bottom: 1px solid rgba(242,239,230,0.08); background: rgba(232,82,26,0.05); overflow: hidden; padding: 1rem 0;}

.shop .section-home{padding: 7rem 4rem;}

.ncr-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
.ncr-preview-wrap{background:#e5e5e5;border-radius:6px;padding:12px;max-height:48vh;overflow:auto;-webkit-overflow-scrolling:touch;display:block}
.ncr-sheet{background:#fff;color:#000;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.35;padding:14px 16px;margin:0 auto;box-sizing:border-box;border:1px solid #000;overflow-wrap:anywhere}
.ncr-sheet *{color:#000 !important;border-color:#000 !important;box-shadow:none !important;box-sizing:border-box}
.ncr-sheet.sz-thermal_58{width:220px;min-width:220px;font-size:10px;padding:8px}
.ncr-sheet.sz-thermal_80{width:300px;min-width:300px;font-size:11px;padding:10px}
.ncr-sheet.sz-ncr_half{width:640px;min-width:600px;font-size:11.5px}
.ncr-sheet.sz-ncr_full{width:700px;min-width:660px;font-size:12px}
.ncr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
.ncr-head.center{display:block;text-align:center;border-bottom:1px dashed #000}
.ncr-brand{font-size:16px;font-weight:700;letter-spacing:.05em}
.ncr-doc-title{font-size:14px;font-weight:700;text-transform:uppercase;border:1.5px solid #000;padding:2px 8px;display:inline-block}
.ncr-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:11px}
.ncr-table-box{width:100%;overflow-x:auto}
.ncr-table{width:100%;border-collapse:collapse;margin:8px 0;table-layout:auto}
.ncr-table th,.ncr-table td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}
.ncr-table th{font-weight:700;text-transform:uppercase;font-size:10.5px}
.ncr-table .c{text-align:center}.ncr-table .r{text-align:right;white-space:nowrap}
.ncr-sheet.sz-thermal_58 .ncr-head,.ncr-sheet.sz-thermal_80 .ncr-head{flex-direction:column;gap:4px}
.ncr-sheet.sz-thermal_58 .ncr-head > div,.ncr-sheet.sz-thermal_80 .ncr-head > div{text-align:left !important;width:100%}
.ncr-sheet.sz-thermal_58 .ncr-meta,.ncr-sheet.sz-thermal_80 .ncr-meta{flex-direction:column;gap:4px;font-size:9.5px}
.ncr-sheet.sz-thermal_58 .ncr-meta > div,.ncr-sheet.sz-thermal_80 .ncr-meta > div{text-align:left !important}
.ncr-sheet.sz-thermal_58 .ncr-table,.ncr-sheet.sz-thermal_80 .ncr-table{table-layout:fixed;font-size:8.5px}
.ncr-sheet.sz-thermal_58 .ncr-table th,.ncr-sheet.sz-thermal_58 .ncr-table td,.ncr-sheet.sz-thermal_80 .ncr-table th,.ncr-sheet.sz-thermal_80 .ncr-table td{padding:2px 3px;word-break:break-word;white-space:normal !important;font-size:8.5px}
.ncr-sheet.sz-thermal_58 .ncr-sigs,.ncr-sheet.sz-thermal_80 .ncr-sigs{gap:8px;margin-top:10px;font-size:9px}
.ncr-sheet.sz-thermal_58 .ncr-sig-box,.ncr-sheet.sz-thermal_80 .ncr-sig-box{padding-top:24px;margin:0 2px}
.ncr-dashed-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;align-items:baseline}
.ncr-dashed-row span:last-child{white-space:nowrap;flex-shrink:0}
.ncr-hr{border:none;border-top:1px dashed #000;margin:6px 0}
.ncr-hr-solid{border:none;border-top:2px solid #000;margin:6px 0}
.ncr-sigs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px;text-align:center;font-size:11px}
.ncr-sigs.cols-3{grid-template-columns:repeat(3,1fr)}
.ncr-sig-box{padding-top:40px;border-top:1px solid #000;margin:0 10px}
.ncr-tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:.75rem}
.ncr-tpl-btn{background:#151513;border:1px solid var(--border);color:var(--gray-light);padding:.5rem .4rem;border-radius:4px;font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.ncr-tpl-btn.active{background:rgba(232,82,26,.16);border-color:var(--orange);color:var(--orange)}
@media (max-width:640px){
  .ncr-tpl-grid{grid-template-columns:repeat(2,1fr)}
  .ncr-opt-grid{grid-template-columns:1fr}
  .ncr-preview-wrap{padding:8px;max-height:44vh}
  #adminPrintModal .modal-content{padding:1rem !important;width:96% !important}
}
/* Back Office Pembuat Nota & Stok Masuk ala iPOS (.pg-abonew, .pg-astock) */
.pg-abonew .bo-card,.pg-astock .bo-card{background:#151513;border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1.1rem}
.pg-abonew .bo-sec-title,.pg-astock .bo-sec-title{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 .9rem;padding-bottom:.5rem;border-bottom:1px dashed var(--border)}
.pg-abonew .bo-header-grid,.pg-astock .bo-header-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}
.pg-abonew .bo-header-grid label,.pg-abonew .bo-footer-grid label,.pg-astock .bo-header-grid label{display:block;font-size:.78rem;color:var(--gray-light);margin-bottom:.35rem}
.pg-abonew .bo-item-search-wrap,.pg-astock .bo-item-search-wrap{position:relative;margin-bottom:1rem}
.pg-abonew .bo-item-results,.pg-astock .bo-item-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1a18;border:1px solid rgba(232,82,26,.35);border-radius:6px;max-height:260px;overflow-y:auto;z-index:900;display:none;box-shadow:0 14px 30px rgba(0,0,0,.65)}
.pg-abonew .bo-item-results.show,.pg-astock .bo-item-results.show{display:block}
.pg-abonew .bo-item-opt,.pg-astock .bo-item-opt{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.65rem .85rem;border-bottom:1px solid rgba(242,239,230,.05);cursor:pointer;font-size:.84rem}
.pg-abonew .bo-item-opt:hover,.pg-astock .bo-item-opt:hover{background:rgba(232,82,26,.12)}
.pg-abonew .bo-num-in,.pg-astock .bo-num-in{width:86px;padding:.4rem .5rem;background:#111110;border:1px solid var(--border);color:var(--off-white);border-radius:4px;font-family:var(--font-mono);font-size:.82rem;text-align:right}
.pg-abonew .bo-price-in,.pg-astock .bo-price-in{width:118px}
.pg-abonew .bo-qty-wrap,.pg-astock .bo-qty-wrap{display:inline-flex;align-items:center;gap:.25rem}
.pg-abonew .bo-qty-wrap .bo-num-in,.pg-astock .bo-qty-wrap .bo-num-in{width:54px;text-align:center}
.pg-abonew .bo-footer-grid{display:grid;grid-template-columns:1fr 360px;gap:1.1rem;align-items:start}
.pg-abonew .bo-sum-row{display:flex;justify-content:space-between;padding:.45rem 0;font-size:.88rem;border-bottom:1px dashed rgba(242,239,230,.06)}
.pg-abonew .bo-sum-total{display:flex;justify-content:space-between;padding:.85rem 0 .4rem;margin-top:.35rem;border-top:2px solid var(--orange);font-size:1.15rem;font-weight:700;color:var(--orange)}
.pg-abonew .bo-actions,.pg-astock .bo-actions{display:flex;gap:.65rem;margin-top:1rem}
.pg-abonew .bo-actions .btn,.pg-astock .bo-actions .btn{flex:1;padding:.75rem;font-weight:600;text-align:center}
.bo-loss-badge{display:inline-block;background:rgba(231,76,60,.18);color:#ff6b6b;border:1px solid rgba(231,76,60,.45);font-size:.68rem;padding:1px 6px;border-radius:3px;font-family:var(--font-mono);margin-top:3px;white-space:nowrap}
@media (max-width:900px){
  .pg-abonew .bo-header-grid,.pg-astock .bo-header-grid{grid-template-columns:1fr 1fr}
  .pg-abonew .bo-footer-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .pg-abonew .bo-card,.pg-astock .bo-card{padding:.95rem}
  .pg-abonew .bo-header-grid,.pg-astock .bo-header-grid{grid-template-columns:1fr;gap:.65rem}
  .pg-abonew .admin-table-wrapper,.pg-astock .admin-table-wrapper{background:transparent;border:none;overflow:visible}
  .pg-abonew .admin-table,.pg-abonew .admin-table tbody,.pg-astock .admin-table,.pg-astock .admin-table tbody{display:block;width:100%}
  .pg-abonew .admin-table thead,.pg-astock .admin-table thead{display:none}
  .pg-abonew .admin-table tbody tr,.pg-astock .admin-table tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;background:#111110;border:1px solid var(--border);border-radius:6px;padding:.85rem;margin-bottom:.65rem}
  .pg-abonew .admin-table tbody td,.pg-astock .admin-table tbody td{padding:0;border:none;min-width:0}
  .pg-abonew .admin-table tbody td:first-child,.pg-astock .admin-table tbody td:first-child{display:none}
  .pg-abonew .admin-table tbody td:nth-child(2),.pg-astock .admin-table tbody td:nth-child(2){grid-column:1 / -1;font-weight:600;font-size:.9rem}
  .pg-abonew .admin-table tbody td:nth-child(3),.pg-astock .admin-table tbody td:nth-child(3){grid-column:1}
  .pg-abonew .admin-table tbody td:nth-child(4),.pg-astock .admin-table tbody td:nth-child(4){grid-column:2}
  .pg-abonew .admin-table tbody td:nth-child(5),.pg-astock .admin-table tbody td:nth-child(5){grid-column:1}
  .pg-abonew .admin-table tbody td:nth-child(6){grid-column:2;align-self:center;text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--orange)}
  .pg-astock .admin-table tbody td:nth-child(5){grid-column:1 / -1;text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--orange)}
  .pg-abonew .admin-table tbody td:nth-child(7),.pg-astock .admin-table tbody td:nth-child(6){grid-column:1 / -1;padding-top:.4rem;border-top:1px dashed var(--border);display:flex;gap:.4rem}
  .pg-abonew .admin-table tbody td:nth-child(7) .btn,.pg-astock .admin-table tbody td:nth-child(6) .btn{flex:1;width:100%}
  .pg-abonew .bo-num-in,.pg-abonew .bo-price-in,.pg-astock .bo-num-in,.pg-astock .bo-price-in{width:100%}
  .pg-abonew .bo-actions,.pg-astock .bo-actions{flex-direction:column}
}
@media print{
  body.ncr-printing #app,body.ncr-printing #toastStack,body.ncr-printing .modal,body.ncr-printing .pl-confirm,body.ncr-printing .pl-snap{display:none !important}
  body.ncr-printing,body.ncr-printing .ncr-print-root{display:block !important;background:#fff !important;margin:0 !important;padding:0 !important}
  body.ncr-printing .ncr-sheet{border:none !important;min-width:0 !important;max-width:100% !important;width:100% !important;padding:0 !important}
}
@media print{
  .shop .nav,.shop .breadcrumb,.shop .ai-fab,.shop .footer-mini,.pg-invoice .inv-actions{display:none !important}
  body,.shop{background:#fff !important;color:#111 !important}
  .pg-invoice .co-section{background:#fff !important;color:#111 !important;border:1px solid #ddd !important;margin:0 !important;max-width:100% !important;box-shadow:none !important}
  .pg-invoice *{color:#111 !important;border-color:#ddd !important}
}

const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

// Format tanggal seperti Carbon::format() (nama bulan bahasa Inggris, APP_LOCALE=en)
function fmtDate(iso, f) {
  const d = new Date(iso); if (isNaN(d)) return '-';
  const D = d.getDate(), M = d.getMonth(), Y = d.getFullYear(), H = pad(d.getHours()), I = pad(d.getMinutes());
  switch (f) {
    case 'd M Y, H:i': return `${pad(D)} ${MONTHS[M].slice(0, 3)} ${Y}, ${H}:${I}`;
    case 'd/m/Y': return `${pad(D)}/${pad(M + 1)}/${Y}`;
    case 'd/m/Y H:i': return `${pad(D)}/${pad(M + 1)}/${Y} ${H}:${I}`;
    case 'd F Y H:i': return `${pad(D)} ${MONTHS[M]} ${Y} ${H}:${I}`;
    case 'F Y': return `${MONTHS[M]} ${Y}`;
    case 'M': return MONTHS[M].slice(0, 3);
    default: return d.toLocaleString('id-ID');
  }
}
// diffForHumans()
function ago(iso) {
  const s = Math.max(1, Math.floor((Date.now() - new Date(iso)) / 1000));
  for (const [n, v] of [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]])
    if (s >= v) { const k = Math.floor(s / v); return `${k} ${n}${k > 1 ? 's' : ''} ago`; }
  return 'just now';
}

function toast(type, title, message) {
  let c = document.getElementById('toastStack');
  if (!c) { c = document.createElement('div'); c.id = 'toastStack'; document.body.appendChild(c); }
  const t = document.createElement('div');
  t.className = 'pl-toast ' + type;
  t.innerHTML = `<div class="pl-toast-icon">${type === 'success' ? ICON.ok : type === 'error' ? ICON.err : ICON.info}</div>
    <div class="pl-toast-body"><div class="pl-toast-title">${esc(title)}</div>${message ? `<div class="pl-toast-msg">${esc(message)}</div>` : ''}</div>
    <button class="pl-toast-x" aria-label="Tutup">×</button>`;
  t.querySelector('.pl-toast-x').onclick = () => t.remove();
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3200);
}

}

/* ---------- Pagination (vendor/pagination/default.blade.php) ---------- */
function paginate(list, page, per) {
  const total = list.length, last = Math.max(1, Math.ceil(total / per));
  const cur = Math.min(Math.max(1, parseInt(page) || 1), last);
  const items = list.slice((cur - 1) * per, cur * per);
  return { items, total, cur, last, per, first: total ? (cur - 1) * per + 1 : 0, lastItem: total ? (cur - 1) * per + items.length : 0 };
}
function pager(pg, hrefFor) {
  if (pg.last <= 1) return '';
  const li = (label, page, state) => state === 'disabled' ? `<li class="page-item disabled"><span class="page-link">${label}</span></li>`
    : state === 'active' ? `<li class="page-item active"><span class="page-link">${label}</span></li>`
    : `<li class="page-item"><a class="page-link" href="${hrefFor(page)}">${label}</a></li>`;
  let pages = [];
  if (pg.last <= 12) pages = Array.from({ length: pg.last }, (_, i) => i + 1);
  else { const s = new Set([1, 2, pg.last - 1, pg.last]); for (let i = pg.cur - 3; i <= pg.cur + 3; i++) if (i > 0 && i <= pg.last) s.add(i); pages = [...s].sort((a, b) => a - b); }
  let html = li('&lsaquo;', pg.cur - 1, pg.cur === 1 ? 'disabled' : ''), prev = 0;
  for (const p of pages) { if (p - prev > 1) html += li('...', 0, 'disabled'); html += li(p, p, p === pg.cur ? 'active' : ''); prev = p; }
  html += li('&rsaquo;', pg.cur + 1, pg.cur === pg.last ? 'disabled' : '');
  return `<nav><ul class="pagination">${html}</ul></nav>`;
}

function searchShopProducts(raw, limit = 8) {
  const q = (raw || '').trim().toLowerCase();
  if (!q) return DB.products.filter(p => p.current_stock > 0).slice(0, limit);
  const tokens = q.split(/\s+/).filter(Boolean);
  return DB.products.map(p => {
    const cat = findCategory(p.category_id)?.name || '';
    const hay = `${p.name} ${p.brand} ${p.item_code} ${cat}`.toLowerCase();
    const words = hay.split(/\s+/);
    let score = 0;
    for (const tk of tokens) {
      let best = 0;
      if (p.item_code.toLowerCase() === tk || p.name.toLowerCase().startsWith(tk)) best = 100;
      else if (hay.includes(tk)) best = 80;
      else {
        for (const w of words) {
          if (w.startsWith(tk)) { best = Math.max(best, 85); break; }
          if (tk.length >= 3) {
            const d = levenshtein(tk, w), maxD = tk.length <= 4 ? 1 : 2;
            if (d <= maxD) best = Math.max(best, 62 - d * 12);
            else if (isSubseq(tk, w)) best = Math.max(best, 38);
          }
        }
      }
      if (!best) return { p, score: 0 };
      score += best;
    }
    if (p.current_stock > 0) score += 3;
    return { p, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, limit).map(x => x.p);
}

function bindShopShell() {
  const shell = $('#shopShell'), mBtn = $('#shopMenuBtn'), cBtn = $('#shopDrawerClose'), bDrop = $('#shopBackdrop');
  const setShopDrawer = open => shell && shell.classList.toggle('drawer-open', open);
  if (mBtn) mBtn.addEventListener('click', () => setShopDrawer(!shell.classList.contains('drawer-open')));
  if (cBtn) cBtn.addEventListener('click', () => setShopDrawer(false));
  if (bDrop) bDrop.addEventListener('click', () => setShopDrawer(false));
  $$('.shop-drawer-link').forEach(a => a.addEventListener('click', () => setShopDrawer(false)));

  const inp = $('#searchInput'), box = $('#searchResults'), btn = $('#searchBtn');
  if (inp && box) {
    let idx = -1, cur = [];
    const run = () => {
      const q = inp.value.trim();
      cur = searchShopProducts(q, 7);
      idx = -1;
      const head = q ? '' : '<div style="padding:.45rem .9rem;font-family:var(--font-mono);font-size:.65rem;color:var(--orange);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(242,239,230,.05);">Produk Populer</div>';
      box.innerHTML = cur.length ? head + cur.map((p, i) => `
        <a href="#/produk/${p.id}" class="search-item" data-idx="${i}">
          <div class="search-item-img">${imgTag(firstImg(p), p.name, PH.search)}</div>
          <div class="search-item-info"><div class="search-item-name">${esc(p.name)}</div><div class="search-item-brand">${esc(p.brand)} · ${esc(p.item_code)} · ${p.current_stock > 0 ? 'Stok ' + p.current_stock : 'Habis'}</div></div>
          <div class="search-item-price">${rp(firstPrice(p))}</div>
        </a>`).join('') + (q ? `<a href="#/produk${qs({ search: q })}" class="search-all-link">Lihat semua hasil untuk "${esc(q)}" &rarr;</a>` : '')
        : '<div class="search-no-results">Produk tidak ditemukan. Coba kata kunci lain.</div>';
      box.classList.add('show');
    };
    const setActive = n => {
      const items = $$('.search-item', box);
      if (!items.length) return;
      idx = (n + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('active', i === idx));
    };
    const goSearch = () => { box.classList.remove('show'); go('#/produk' + qs({ search: inp.value.trim() })); };
    inp.addEventListener('focus', run);
    inp.addEventListener('input', run);
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(idx + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(idx - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (idx >= 0 && cur[idx]) { box.classList.remove('show'); go('#/produk/' + cur[idx].id); }
        else goSearch();
      } else if (e.key === 'Escape') { box.classList.remove('show'); inp.blur(); }
    });
    btn.addEventListener('click', goSearch);
  }
  const nb = $('#notifBtn');
  if (nb) nb.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); $('#notifDropdown').classList.toggle('show'); });
  if (AI.open) $('#aiModal')?.classList.add('show');
}

function pageCatalog(q, fixedCat) {
  const lvl = tierLevel();
  const selected = fixedCat ? fixedCat.id : (q.category ? Number(q.category) : null);
  const search = fixedCat ? '' : String(q.search || '').trim();
  let list = DB.products.slice();
  if (search) list = searchShopProducts(search, 999);
  if (selected) list = list.filter(p => p.category_id === selected);
  // Demo: filter memakai harga eceran (L1) yang terlihat di kartu, bukan base_price (harga modal)
  const all = DB.products.map(priceL1);
  const statMin = all.length ? Math.min(...all) : 0, statMax = all.length ? Math.max(...all) : 1000000;
  const minP = q.min_price !== undefined && q.min_price !== '' ? Number(q.min_price) : null;
  const maxP = q.max_price !== undefined && q.max_price !== '' ? Number(q.max_price) : null;
  if (minP !== null) list = list.filter(p => priceL1(p) >= minP);
  if (maxP !== null) list = list.filter(p => priceL1(p) <= maxP);
  const pg = paginate(list, q.page, 9);
  const base = { search: search || undefined, min_price: q.min_price, max_price: q.max_price };
  const href = page => fixedCat ? '#/kategori/' + slugify(fixedCat.name) + qs({ page }) : '#/produk' + qs({ ...base, category: selected || undefined, page });
  const vMin = minP ?? statMin, vMax = maxP ?? statMax;
  const html = `<div class="page-wrapper">
    <div class="breadcrumb"><a href="#/">HOME</a> <span>/</span> KATALOG</div>
    <div class="shop-layout">
      <aside class="sidebar">
        <div class="sidebar-card">
          <div class="sidebar-title">Kategori</div>
          <ul class="filter-list">
            <li><a href="#/produk" class="filter-item ${!selected ? 'active' : ''}">Semua Produk <span class="count">${num(DB.products.length)}</span></a></li>
            ${DB.categories.map(c => `<li><a href="#/produk${qs({ ...base, category: c.id })}" class="filter-item ${selected === c.id ? 'active' : ''}">${esc(c.name)} <span class="count">${num(catCount(c.id))}</span></a></li>`).join('')}
          </ul>
        </div>
        <button type="button" class="cat-price-toggle" onclick="const c=this.nextElementSibling;c.classList.toggle('open');this.querySelector('span').textContent=c.classList.contains('open')?'&#9652;':'&#9662;';">Filter Rentang Harga <span>&#9662;</span></button>
        <div class="sidebar-card sidebar-price-card">
          <div class="sidebar-title">Rentang Harga</div>
          <div class="price-range-container">
            <div class="range-values"><span>Rp <span id="minPriceLabel">${num(vMin)}</span></span><span>Rp <span id="maxPriceLabel">${num(vMax)}</span></span></div>
            <div class="double-range-wrapper" style="position: relative; height: 30px; margin: 1rem 0;">
              <div style="position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: rgba(242,239,230,0.15); border-radius: 2px; transform: translateY(-50%);"></div>
              <input type="range" id="priceRangeMin" min="${statMin}" max="${statMax}" value="${vMin}" step="1000" style="position: absolute; width: 100%; height: 30px; background: transparent; pointer-events: none; -webkit-appearance: none; margin: 0;">
              <input type="range" id="priceRangeMax" min="${statMin}" max="${statMax}" value="${vMax}" step="1000" style="position: absolute; width: 100%; height: 30px; background: transparent; pointer-events: none; -webkit-appearance: none; margin: 0;">
            </div>
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button type="button" id="applyPrice" class="btn btn-primary btn-sm" style="flex: 1; justify-content: center;">Terapkan</button>
            <a href="#/produk" class="btn btn-outline btn-sm" style="text-align: center; padding: 0.45rem 0.8rem; font-size: 0.75rem;">Reset</a>
          </div>
        </div>
      </aside>
      <main class="shop-main">
        ${search ? `<div class="active-filters"><span class="filter-tag">Pencarian: "${esc(search)}" <a href="#/produk${qs({ category: selected || undefined })}" title="Hapus">×</a></span></div>` : ''}
        <div class="shop-topbar"><div style="font-size:0.82rem; color:var(--gray-mid);">Menampilkan <strong>${pg.first}–${pg.lastItem}</strong> dari <strong>${pg.total}</strong> produk</div></div>
        <div class="product-grid">${pg.items.map(p => prodCard(p, lvl)).join('')}</div>
        ${pg.total ? '' : '<div style="padding:3rem 0; text-align:center; color:var(--gray-mid);">Tidak ada produk yang cocok dengan filter.</div>'}
        <div>${pager(pg, href)}</div>
      </main>
    </div>
  </div>`;
  const after = () => {
    const sMin = $('#priceRangeMin'), sMax = $('#priceRangeMax');
    const upd = () => { $('#minPriceLabel').textContent = num(sMin.value); $('#maxPriceLabel').textContent = num(sMax.value); };
    sMin.addEventListener('input', () => { if (+sMin.value > +sMax.value) sMin.value = sMax.value; upd(); });
    sMax.addEventListener('input', () => { if (+sMax.value < +sMin.value) sMax.value = sMin.value; upd(); });
    $('#applyPrice').addEventListener('click', () => go('#/produk' + qs({ search: search || undefined, category: selected || undefined, min_price: sMin.value, max_price: sMax.value })));
  };
  return { title: 'Katalog Produk', cls: 'pg-catalog', html, after };
}
function pageCategory(q, slug) {
  const cat = DB.categories.find(c => slugify(c.name) === slug);
  if (!cat) return page404();
  return pageCatalog(q, cat);
}

function buildCheckoutItems(q) {
  const u = me(), lvl = tierLevel();
  const mk = (p, qty) => { const price = checkoutPrice(p, lvl), original = priceL1(p);
    return { id: p.id, name: p.name, brand: p.brand, qty, price, original_price: original, subtotal: price * qty, stock: p.current_stock }; };
  if (q.product_id) {
    const p = findProduct(q.product_id); if (!p) return { error404: true };
    const qty = parseInt(q.qty) || 1;
    if (qty > p.current_stock) return { redirect: '#/produk/' + p.id, flash: ['error', 'Gagal', `Stok tidak cukup. Sisa stok: ${p.current_stock} pcs.`] };
    return { items: [mk(p, qty)], productId: p.id, qty };
  }
  const cart = cartOf(u.id);
  if (!cart.length) return { redirect: '#/cart', flash: ['error', 'Gagal', 'Keranjang Anda kosong.'] };
  const items = [];
  for (const c of cart) {
    const p = findProduct(c.product_id); if (!p) continue;
    if (c.qty > p.current_stock) return { redirect: '#/cart', flash: ['error', 'Gagal', `Stok ${p.name} tidak cukup. Sisa: ${p.current_stock} pcs.`] };
    items.push(mk(p, c.qty));
  }
  return { items, productId: null, qty: 1 };
}

function downloadInvoice(inv) {
  const u = me(); if (!u) return;
  const t = DB.transactions.find(x => x.invoice_number === inv && x.user_id === u.id);
  if (!t) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    toast('info', 'Mode Offline', 'Library PDF belum termuat. Gunakan dialog cetak untuk Simpan sebagai PDF.');
    window.print();
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const L = 40, R = 555;
  const isPaid = ['processing', 'shipped', 'delivered', 'done'].includes(t.status);
  const statusText = isPaid ? 'LUNAS' : t.status === 'cancelled' ? 'DIBATALKAN' : 'PENDING';
  const statusRgb = isPaid ? [26, 127, 55] : t.status === 'cancelled' ? [200, 40, 40] : [232, 82, 26];

  let y = 52;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(17, 17, 17);
  doc.text('PARTLYFE', L, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(102, 102, 102);
  doc.text('Distributor Sparepart Motor Terpercaya', L, y + 16);

  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(17, 17, 17);
  doc.text('INVOICE', R, y, { align: 'right' });
  doc.setFont('courier', 'normal'); doc.setFontSize(10); doc.setTextColor(102, 102, 102);
  doc.text(String(t.invoice_number), R, y + 15, { align: 'right' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...statusRgb);
  doc.text(statusText, R, y + 30, { align: 'right' });

  y += 50;
  doc.setDrawColor(225, 225, 225); doc.line(L, y, R, y);
  y += 22;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(120, 120, 120);
  doc.text('DITAGIHKAN KEPADA', L, y);
  doc.text('TANGGAL TRANSAKSI', R, y, { align: 'right' });

  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(17, 17, 17);
  doc.text(String(u.name || '-'), L, y + 16);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(80, 80, 80);
  doc.text(String(u.phone || '-'), L, y + 31);
  doc.text(String(u.email || '-'), L, y + 46);
  doc.setTextColor(17, 17, 17);
  doc.text(`${fmtDate(t.created_at, 'd F Y H:i')} WIB`, R, y + 16, { align: 'right' });

  y += 70;
  doc.setFillColor(245, 245, 245); doc.rect(L, y, R - L, 24, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text('NAMA BARANG', L + 8, y + 15);
  doc.text('QTY', 345, y + 15, { align: 'center' });
  doc.text('HARGA', 445, y + 15, { align: 'right' });
  doc.text('SUBTOTAL', R - 8, y + 15, { align: 'right' });
  y += 24;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  detailsOf(t.id).forEach(d => {
    const p = findProduct(d.product_id);
    const nameLines = doc.splitTextToSize(p ? p.name : 'Produk tidak tersedia', 260);
    const rowH = Math.max(24, nameLines.length * 14 + 10);
    if (y + rowH > 760) { doc.addPage(); y = 48; }
    doc.setTextColor(17, 17, 17);

  });

  y += 24;
  if (y > 720) { doc.addPage(); y = 48; }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(102, 102, 102);
  doc.text('Subtotal', 360, y);

  y += 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(17, 17, 17);
  doc.text('TOTAL', 360, y);
  doc.setTextColor(232, 82, 26);
  doc.text(rp(t.total_amount), R - 8, y, { align: 'right' });

  y += 42;
  doc.setDrawColor(225, 225, 225); doc.setLineWidth(0.5); doc.line(L, y, R, y);
  y += 20;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110, 110, 110);

function levenshtein(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 99;
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
  return dp[a.length][b.length];
}
function isSubseq(q, t) { let i = 0; for (let j = 0; j < t.length && i < q.length; j++) if (q[i] === t[j]) i++; return i === q.length; }
function searchAdminModules(raw) {
  const q = (raw || '').trim().toLowerCase();
  if (!q) return ADMIN_MODULES.slice(0, 7);
  const tokens = q.split(/\s+/).filter(Boolean);
  return ADMIN_MODULES.map(m => {
    const titleL = m.title.toLowerCase(), codeL = m.code.toLowerCase(), words = `${titleL} ${codeL} ${m.kw}`.split(/\s+/);
    let score = 0;
    for (const tk of tokens) {
      let best = 0;
      if (codeL === tk || titleL.startsWith(tk)) best = 100;
      else if (titleL.includes(tk) || m.kw.includes(tk)) best = 75;
      else {
        for (const w of words) {
          if (w.startsWith(tk)) { best = Math.max(best, 85); break; }
          if (tk.length >= 3) {
            const d = levenshtein(tk, w), maxD = tk.length <= 4 ? 1 : 2;
            if (d <= maxD) best = Math.max(best, 62 - d * 12);
            else if (isSubseq(tk, w)) best = Math.max(best, 38);
          }
        }
      }
      if (!best) return { m, score: 0 };
      score += best;
    }
    return { m, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 6).map(x => x.m);

function bindAdminShell() {
  const btn = $('#adminMenuBtn'), closeBtn = $('#adminDrawerClose'), backdrop = $('#adminBackdrop'), shell = $('#admShell');
  const cmdIn = $('#adminCmdInput'), cmdBox = $('#adminCmdResults'), cmdWrap = $('#adminCmdWrap');
  if (!shell) return;
  const setDrawer = open => {
    shell.classList.toggle('nav-open', open);
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  if (btn) btn.addEventListener('click', () => setDrawer(!shell.classList.contains('nav-open')));
  if (closeBtn) closeBtn.addEventListener('click', () => setDrawer(false));
  if (backdrop) backdrop.addEventListener('click', () => setDrawer(false));
  $$('.admin-nav .nav-item, .admin-drawer-actions a').forEach(a => a.addEventListener('click', () => setDrawer(false)));
  if (cmdIn && cmdBox) {
    let idx = 0, cur = [];
    const renderCmd = () => {
      cur = searchAdminModules(cmdIn.value);
      idx = 0;
      cmdBox.innerHTML = cur.length ? cur.map((m, i) => `
        <a href="${m.route}" class="admin-cmd-item ${i === 0 ? 'active' : ''}" data-idx="${i}">
          <span class="admin-cmd-code">${m.code}</span>
          <span class="admin-cmd-meta"><div class="admin-cmd-title">${esc(m.title)}</div><div class="admin-cmd-desc">${esc(m.desc)}</div></span>
          <span class="admin-cmd-go">&#8629; Buka</span>
        </a>`).join('') : '<div class="admin-cmd-empty">Modul tidak ditemukan. Coba kata lain seperti "produk", "kasir", atau "laporan".</div>';
      cmdBox.classList.add('show');
      $$('.admin-cmd-item', cmdBox).forEach(el => el.addEventListener('click', () => cmdBox.classList.remove('show')));
    };
    const setActive = n => {
      const items = $$('.admin-cmd-item', cmdBox);
      if (!items.length) return;
      idx = (n + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('active', i === idx));
    };
    cmdIn.addEventListener('focus', renderCmd);
    cmdIn.addEventListener('input', renderCmd);
    cmdIn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(idx + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(idx - 1); }
      else if (e.key === 'Enter' && cur.length) { e.preventDefault(); cmdBox.classList.remove('show'); go(cur[idx].route); }
      else if (e.key === 'Escape') { cmdBox.classList.remove('show'); cmdIn.blur(); }
    });
    document.addEventListener('click', e => { if (cmdWrap && !cmdWrap.contains(e.target)) cmdBox.classList.remove('show'); });
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && $('#adminCmdInput')) { e.preventDefault(); $('#adminCmdInput').focus(); } });
  }
}

const PAID = ['processing', 'shipped', 'delivered', 'done'];
function monthlyRevenue(n) {
  const m = {};
  DB.transactions.filter(t => PAID.includes(t.status)).forEach(t => { const d = new Date(t.created_at); const k = d.getFullYear() * 100 + d.getMonth(); m[k] = (m[k] || 0) + Number(t.total_amount); });
  return Object.keys(m).map(Number).sort((a, b) => b - a).slice(0, n).map(k => ({ year: Math.floor(k / 100), month: k % 100, total: m[k] }));
}
function salesByCategory() {
  const ok = ['processing', 'shipped', 'delivered'], m = {};
  DB.transaction_details.forEach(d => {
    const t = DB.transactions.find(x => x.id === d.transaction_id), p = findProduct(d.product_id);
    if (!t || !p || !ok.includes(t.status)) return;
    const c = findCategory(p.category_id); if (!c) return;
    m[c.name] = (m[c.name] || 0) + d.qty * d.price;
  });
  return Object.entries(m).map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total).slice(0, 5);
}
const monthLabel = r => fmtDate(new Date(r.year, r.month, 1).toISOString(), 'F Y');

// AdminController@addStock / reduceStock
function addStockAction(id, amount, note) {
  const p = findProduct(id), n = parseInt(amount);
  if (!p) return { success: false, message: 'Produk tidak ditemukan.' };
  if (!(n >= 1)) return { success: false, message: 'Validasi gagal: The stock field must be at least 1.' };
  const prev = p.current_stock; p.current_stock = prev + n;
  notify(null, 'Stok Ditambahkan', `Stok produk '${p.name}' ditambah ${n} pcs (dari ${prev} menjadi ${p.current_stock}).`, 'system');
  save(); return { success: true, message: 'Stok berhasil ditambahkan.' };
}
function reduceStockAction(id, amount) {
  const p = findProduct(id), n = parseInt(amount);
  if (!p) return { success: false, message: 'Produk tidak ditemukan.' };
  if (!(n >= 1)) return { success: false, message: 'Validasi gagal: The stock field must be at least 1.' };
  if (n > p.current_stock) return { success: false, message: 'Jumlah stok yang dikurangi melebihi stok yang tersedia.' };
  const prev = p.current_stock; p.current_stock = prev - n;
  notify(null, 'Stok Dikurangi', `Stok produk '${p.name}' dikurangi ${n} pcs (dari ${prev} menjadi ${p.current_stock}).`, 'system');
  save(); return { success: true, message: 'Stok berhasil dikurangi.' };
}

function resetAdminProductFilters() {
  if ($('#prodSearch')) $('#prodSearch').value = '';
  if ($('#prodCatFilter')) $('#prodCatFilter').value = '';
  if ($('#prodBrandFilter')) $('#prodBrandFilter').value = '';
  if ($('#prodSort')) $('#prodSort').value = 'latest';
  if ($('#prodStockFilter')) $('#prodStockFilter').value = '';
  $$('#prodStockChips .admin-chip').forEach((ch, i) => ch.classList.toggle('active', i === 0));
  renderAdminProductsList(1);
}
function renderAdminProductsList(page = 1) {
  const s = ($('#prodSearch')?.value || '').trim().toLowerCase();
  const cat = $('#prodCatFilter')?.value || '';
  const brand = $('#prodBrandFilter')?.value || '';
  const stk = $('#prodStockFilter')?.value || '';
  const sort = $('#prodSort')?.value || 'latest';
  const list = latest(DB.products).filter(p => {
    if (s && !`${p.name} ${p.item_code} ${p.brand}`.toLowerCase().includes(s)) return false;
    if (cat && String(p.category_id) !== cat) return false;
    if (brand && p.brand !== brand) return false;
    if (stk === 'ok' && p.current_stock <= 5) return false;
    if (stk === 'low' && !(p.current_stock > 0 && p.current_stock <= 5)) return false;
    if (stk === 'out' && p.current_stock > 0) return false;
    return true;
  });
  const priceOf = p => hasPrice(p, 1) ? Number(p.prices[1]) : 0;
  if (sort === 'stock_asc') list.sort((a, b) => a.current_stock - b.current_stock);
  else if (sort === 'stock_desc') list.sort((a, b) => b.current_stock - a.current_stock);
  else if (sort === 'price_asc') list.sort((a, b) => priceOf(a) - priceOf(b));
  else if (sort === 'price_desc') list.sort((a, b) => priceOf(b) - priceOf(a));
  else if (sort === 'name_asc') list.sort((a, b) => a.name.localeCompare(b.name));
  const pg = paginate(list, page, 10);
  const hasFilter = Boolean(s || cat || brand || stk || sort !== 'latest');
  if ($('#prodFilterMeta')) {
    $('#prodFilterMeta').innerHTML = `<span>Menampilkan <strong>${pg.items.length}</strong> dari <strong>${list.length}</strong> produk</span>` +
      (hasFilter ? '<button type="button" class="admin-reset-link" onclick="resetAdminProductFilters()">Reset Filter</button>' : '');
  }
  $('#prodTbody').innerHTML = pg.items.length ? pg.items.map((p, i) => `<tr>
    <td>${(pg.cur - 1) * pg.per + i + 1}</td>
    <td>${imgTag(firstImg(p), p.name, `<div class="product-image-placeholder">${PH.icon(20, 1).replace('stroke-width="1.2"', 'stroke-width="1.5"')}</div>`, '', 'product-image-thumb')}</td>
    <td>${esc(p.name)}<div style="font-size:0.75rem; color:#B8B4A8; font-family:var(--font-mono); margin-top:2px;">${esc(p.item_code)} · ${esc(p.brand)} · ${esc(p.unit)}</div></td>
    <td>${esc(findCategory(p.category_id)?.name || '-')}</td>
    <td><span class="stock-badge ${p.current_stock <= 0 ? 'stock-out' : p.current_stock <= 5 ? 'stock-low' : 'stock-ok'}">${p.current_stock} pcs</span></td>
    <td>${rp(priceOf(p))}</td>
    <td style="white-space:nowrap;">
      <button class="btn btn-sm" style="background:transparent; border:1px solid var(--orange); color:var(--orange);" onclick="editProduct(${p.id})">Edit</button>
      <button class="btn btn-sm" style="background:transparent; border:1px solid #17a2b8; color:#17a2b8; margin-left:0.5rem;" onclick="openStockModal(${p.id}, 'add')">+Stok</button>
      <button class="btn btn-sm" style="background:transparent; border:1px solid #ffc107; color:#ffc107; margin-left:0.5rem;" onclick="openStockModal(${p.id}, 'reduce')">-Stok</button>
      <button class="btn btn-sm" style="background:transparent; border:1px solid #dc3545; color:#dc3545; margin-left:0.5rem;" onclick="deleteProduct(${p.id})">Hapus</button>
    </td></tr>`).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Produk tidak ditemukan</td></tr>';
  $('#prodPager').innerHTML = pg.last > 1 ? pager(pg, p => '#/admin/products' + qs({ page: p, q: s || undefined, cat: cat || undefined, brand: brand || undefined, stock: stk || undefined, sort: sort !== 'latest' ? sort : undefined })) : '';
}
function openProductModal() {
  $('#productForm').reset(); $('#productId').value = ''; $('#image-preview').innerHTML = '';
  $('#modalTitle').textContent = 'Tambah Produk'; openModal('productModal');
}
function editProduct(id) {
  const p = findProduct(id); if (!p) return adminToast('error', 'Gagal mengambil data produk');
  $('#productForm').reset(); $('#image-preview').innerHTML = '';
  $('#modalTitle').textContent = 'Edit Produk';
  $('#productId').value = p.id; $('#item_code').value = p.item_code || ''; $('#name').value = p.name || ''; $('#brand').value = p.brand || '';
  $('#category_id').value = p.category_id || ''; $('#unit').value = p.unit || 'PCS'; $('#base_price').value = p.base_price || 0; $('#current_stock').value = p.current_stock || 0;
  tierLevels().forEach(l => { const el = $('#price_level_' + l); if (el) el.value = hasPrice(p, l) ? p.prices[l] : ''; });
  openModal('productModal');
}
function downscaleImage(file, max = 600) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onerror = reject;
    rd.onload = () => { const img = new Image(); img.onerror = reject; img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/webp', 0.82)); }; img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}
async function saveProduct(form) { // AdminController@storeProduct / updateProduct
  const fd = new FormData(form), v = k => String(fd.get(k) ?? '').trim();
  const id = v('productId') ? Number(v('productId')) : null, errs = [];
  if (!v('category_id') || !findCategory(v('category_id'))) errs.push('The category id field is required.');
  if (!v('name')) errs.push('The name field is required.');
  if (!v('brand')) errs.push('The brand field is required.');
  if (!v('unit')) errs.push('The unit field is required.');
  if (v('base_price') === '' || Number(v('base_price')) < 0) errs.push('The base price field must be at least 0.');
  if (v('current_stock') === '' || !Number.isInteger(Number(v('current_stock'))) || Number(v('current_stock')) < 0) errs.push('The current stock field must be an integer of at least 0.');
  const code = v('item_code');
  if (code && DB.products.some(p => p.item_code === code && p.id !== id)) errs.push('The item code has already been taken.');
  const files = [...(form.querySelector('#images').files || [])];
  files.forEach(f => {
    if (!/^image\/(jpeg|png|gif)$/.test(f.type)) errs.push('The images field must be a file of type: jpeg, png, jpg, gif.');
    if (f.size > 2048 * 1024) errs.push('The images field must not be greater than 2048 kilobytes.');
  });
  if (errs.length) return showAdminToast('error', 'Gagal Menyimpan', 'Validasi gagal: ' + [...new Set(errs)].join(', '));
  let imgs = [];
  try { imgs = await Promise.all(files.map(f => downscaleImage(f))); } catch (e) { return showAdminToast('error', 'Gagal Menyimpan', 'Gambar tidak dapat dibaca.'); }
  const data = { category_id: Number(v('category_id')), name: v('name'), brand: v('brand'), unit: v('unit'), base_price: Number(v('base_price')), current_stock: Number(v('current_stock')) };
  let p;
  if (id) {
    p = findProduct(id); Object.assign(p, data, { item_code: code || p.item_code, barcode: code || p.barcode, updated_at: nowIso() });
    tierLevels().forEach(l => { const pr = v(`prices[${l}]`); if (pr !== '' && Number(pr) > 0) p.prices[l] = Number(pr); else delete p.prices[l]; });
  } else {
    const gen = 'PRD-' + randStr(8);
    p = { id: nextId('products'), item_type: 'barang', item_code: code || gen, barcode: code || gen, cashback_percent: 0, prices: {}, images: [], created_at: nowIso(), ...data };
    tierLevels().forEach(l => { const pr = v(`prices[${l}]`); if (pr !== '' && Number(pr) > 0) p.prices[l] = Number(pr); });
    DB.products.push(p);
    notify(null, 'Produk Baru Ditambahkan', `Produk baru '${p.name}' telah ditambahkan ke katalog.`, 'system');
  }
  p.images.push(...imgs);
  if (!save()) { p.images.splice(p.images.length - imgs.length, imgs.length); save(); }
  closeModal('productModal');
  showAdminToast('success', 'Berhasil', id ? 'Produk berhasil diperbarui.' : 'Produk berhasil ditambahkan.');
  rerender();
}
function openStockModal(id, action) {
  $('#stockForm').reset(); $('#stockProductId').value = id; $('#stockAction').value = action;
  $('#stockModalTitle2').textContent = (action === 'add' ? 'Tambah Stok: ' : 'Kurangi Stok: ') + findProduct(id).name;
  openModal('stockModal'); $('#stockAmount').focus();
}
function deleteProduct(id) { // AdminController@destroyProduct (relasi cascadeOnDelete ikut terhapus)
  confirmBox('Yakin ingin menghapus produk ini?', ok => {
    if (!ok) return;
    const tids = new Set(DB.transaction_details.filter(d => d.product_id === id).map(d => d.id));
    DB.products = DB.products.filter(p => p.id !== id);
    DB.carts = DB.carts.filter(c => c.product_id !== id);
    DB.wishlists = DB.wishlists.filter(w => w.product_id !== id);
    DB.stock_movements = DB.stock_movements.filter(s => s.product_id !== id);
    DB.transaction_details = DB.transaction_details.filter(d => !tids.has(d.id));
    save(); rerender(); toast('success', 'Produk berhasil dihapus.');
  });
}

    <div style="margin-bottom:1rem;"><label style="display:block; margin-bottom:0.5rem; color:var(--gray-mid);">Uang Diterima</label><input type="number" id="cashReceived" class="form-control" min="0" oninput="posCalculateChange()"></div>
    <div style="margin-bottom:1rem;"><label style="display:block; margin-bottom:0.5rem; color:var(--gray-mid);">Kembalian</label><input type="text" id="cashChange" class="form-control" readonly></div>
    <button class="btn" style="width:100%;" onclick="posConfirmCash()">Konfirmasi Pembayaran</button>
  </div></div>`;
  const after = () => { posRenderGrid(); posRenderCart(); posRenderCustomer(); };
  return { shell: 'admin', nav: 'pos', title: 'POS - Point of Sale', cls: 'pg-apos', html, after };
}
const posMatch = (p, s) => p.name.toLowerCase().includes(s) || p.item_code.toLowerCase().includes(s) || p.brand.toLowerCase().includes(s);
function posRenderGrid() {
  const s = ($('#posSearch')?.value || '').trim().toLowerCase();
  const list = s.length >= 2 ? DB.products.filter(p => posMatch(p, s)) : DB.products;
  $('#productsGrid').innerHTML = list.length ? list.map(p => `
    <div class="pos-item ${p.current_stock <= 0 ? 'pos-item-out' : ''}" onclick="posAdd(${p.id})">
      <div style="font-weight:bold; margin-bottom:0.5rem; color:var(--off-white);">${esc(p.name)}</div>
      <div style="color:var(--orange); font-family:var(--font-mono);">${rp(posPrice(p))}</div>
      <div style="color:var(--gray-mid); font-size:0.8rem; margin-top:0.5rem;">Stok: ${p.current_stock}</div>
    </div>`).join('') : '<div style="padding:2rem; color:var(--gray-mid);">Tidak ada produk ditemukan</div>';
}
function posAdd(id) {
  const p = findProduct(id); const ex = POS.cart.find(i => i.id === id); const q = (ex ? ex.qty : 0) + 1;
  if (q > p.current_stock) return toast('error', 'Stok tidak cukup', `Stok ${p.name} tidak cukup. Sisa: ${p.current_stock} pcs.`);
  if (ex) ex.qty = q; else POS.cart.push({ id, qty: 1 });
  posRenderCart();
}
function posChangeQty(idx, d) {
  const i = POS.cart[idx]; if (!i) return;
  if (d > 0) return posAdd(i.id);
  i.qty -= 1; if (i.qty < 1) POS.cart.splice(idx, 1); posRenderCart();
}
function posRemove(idx) { POS.cart.splice(idx, 1); posRenderCart(); }
function posRenderCart() {
  const box = $('#cartItems'); if (!box) return;
  box.innerHTML = POS.cart.length ? POS.cart.map((i, idx) => { const p = findProduct(i.id); const pr = posPrice(p); return `
    <div class="cart-row">
      <div>${esc(p.name)} <span style="color:var(--gray-mid);">(x${i.qty})</span>
        <div style="font-size:0.75rem; color:var(--gray-mid); font-family:var(--font-mono); margin-top:0.2rem;">${rp(pr)} / ${esc(p.unit)} · ${rp(pr * i.qty)}</div></div>
      <div style="display:flex; align-items:flex-start; gap:0.25rem;">
        <button class="pos-qty-btn" onclick="posChangeQty(${idx}, -1)" title="Kurangi">−</button>
        <button class="pos-qty-btn" onclick="posChangeQty(${idx}, 1)" title="Tambah">+</button>
        <button onclick="posRemove(${idx})" style="background:none; border:none; color:var(--red); cursor:pointer; font-size:1.2rem;" title="Hapus">&times;</button>
      </div>
    </div>`; }).join('') : '<div style="color:var(--gray-mid); font-size:0.85rem;">Klik produk di sebelah kiri untuk menambahkannya.</div>';
  $('#cartTotal').textContent = rp(posTotal());
}
function posSelectPayment(m) {
  POS.payment = m; $$('.payment-option').forEach(el => el.classList.remove('selected'));
  $('#payment' + ucfirst(m)).classList.add('selected');
}
function posSearchCustomers() {
  const q = $('#customerSearch').value, box = $('#customerSearchResults');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const s = q.toLowerCase();
  const us = customers().filter(u => u.name.toLowerCase().includes(s) || u.email.toLowerCase().includes(s)).slice(0, 10);
  box.innerHTML = `<div class="customer-result" onclick="posSelectCustomer(null)">+ Tambah Walk-in Customer</div>` + us.map(u => `<div class="customer-result" onclick="posSelectCustomer(${u.id})">${esc(u.name)} - ${esc(u.email)}</div>`).join('');
}
function posSelectCustomer(id) {
  POS.userId = id; POS.walkIn = id === null;
  $('#customerSearchResults').innerHTML = ''; $('#customerSearch').value = '';
  if (POS.walkIn) $('#walkInName').value = '';
  posRenderCustomer(); posRenderGrid(); posRenderCart();
}
function posRenderCustomer() {
  const sel = $('#selectedCustomer'), w = $('#walkInName'), u = posUser();
  if (u) { sel.innerHTML = `Pelanggan: ${esc(u.name)} <span style="color:var(--orange); font-family:var(--font-mono); font-size:0.78rem;">· ${esc(u.customer_group)} → harga Level ${posLevel()}</span> <a href="javascript:void(0)" onclick="posResetCustomer()" style="color:var(--gray-mid); margin-left:0.25rem;">×</a>`; w.style.display = 'none'; }
  else if (POS.walkIn) { sel.innerHTML = 'Pelanggan: Walk-in Customer <a href="javascript:void(0)" onclick="posResetCustomer()" style="color:var(--gray-mid); margin-left:0.25rem;">×</a>'; w.style.display = 'block'; }
  else { sel.textContent = ''; w.style.display = 'none'; }
}
function posResetCustomer() { POS.userId = null; POS.walkIn = false; posRenderCustomer(); posRenderGrid(); posRenderCart(); }
function posSearchProducts() {
  const q = $('#searchBoxPos').value, box = $('#searchResultsPos');
  if (q.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = DB.products.filter(p => posMatch(p, q.toLowerCase())).slice(0, 10)
    .map(p => `<div class="search-item-pos" onclick="posAdd(${p.id})">${esc(p.name)} - ${rp(posPrice(p))} <span style="color:var(--gray-mid); font-size:0.8rem;">(stok ${p.current_stock})</span></div>`).join('')
    || '<div style="padding:0.5rem; color:var(--gray-mid);">Tidak ada produk ditemukan</div>';
}
function posCheckout() {
  if (!POS.cart.length) return toast('info', 'Keranjang POS kosong');
  if (POS.payment === 'cash') {
    const t = posTotal(); $('#cashTotal').textContent = rp(t); $('#cashReceived').value = t; $('#cashChange').value = 0;
    openModal('cashPaymentModal');
  } else posProcess('midtrans');
}
function posCalculateChange() {
  const change = (parseInt($('#cashReceived').value) || 0) - posTotal();
  $('#cashChange').value = change >= 0 ? change.toLocaleString('id-ID') : 0;
}
function posConfirmCash() {
  const received = parseInt($('#cashReceived').value) || 0, total = posTotal();
  if (received < total) return toast('error', 'Uang kurang', `Uang diterima kurang ${rp(total - received)} dari total pembayaran.`);
  const r = posProcess('cash'); if (!r) return;
  closeModal('cashPaymentModal');
  toast('success', 'Transaksi berhasil!', `${r.inv} · Kembalian ${rp(received - total)}`);
  openAdminPrintModal(r.tid, 'short');
}
function posProcess(method) { // PosController@store
  const u = posUser(), lvl = u ? mapGroupToLevel(u.customer_group) : 1;
  for (const i of POS.cart) { const p = findProduct(i.id); if (!p || i.qty > p.current_stock) { toast('error', 'Gagal', `Stok ${p ? p.name : 'produk'} tidak cukup.`); return null; } }
  const tid = nextId('transactions'), inv = 'POS-' + randStr(8); let total = 0; const dets = [];
  POS.cart.forEach(i => { const p = findProduct(i.id), price = priceAt(p, lvl); total += price * i.qty; p.current_stock -= i.qty; dets.push({ product_id: p.id, qty: i.qty, price }); });
  const walkName = ($('#walkInName')?.value || '').trim() || 'Walk-in Customer';
  DB.transactions.push({ id: tid, invoice_number: inv, user_id: u ? u.id : null, total_amount: total, status: method === 'cash' ? 'processing' : 'pending', payment_method: method,
    shipping_address: u ? (u.address || u.name) : walkName, snap_token: method === 'midtrans' ? 'demo-' + randStr(12) : null, created_at: nowIso() });
  dets.forEach(d => DB.transaction_details.push({ id: nextId('transaction_details'), transaction_id: tid, ...d }));
  if (u) { u.total_spent = Number(u.total_spent) + total; checkLevelUpgrade(u); }
  save();
  const done = () => { POS.cart = []; posResetCustomer(); };
  if (method === 'midtrans') {
    snapPay({ id: inv, amount: total }, {
      onSuccess: () => { const t = DB.transactions.find(x => x.id === tid); if (t) { t.status = 'processing'; save(); } adminToast('success', 'Pembayaran berhasil!'); done(); openAdminPrintModal(tid, 'short'); },
      onPending: () => { adminToast('info', 'Menunggu pembayaran...'); done(); },
      onClose: () => { adminToast('info', 'Popup ditutup. Transaksi tersimpan sebagai pending.'); done(); }
    });
  } else done();
  return { tid, inv, total };
}

  <div id="siPriceModal" class="modal" style="z-index:12500;">

        ${[...sortedTiers()].reverse().map((t, idx, arr) => `<div class="form-group"><label>${esc(t.name)} (Enter ${idx + 1} &rarr; ${idx < arr.length - 1 ? 'Level ' + arr[idx + 1].price_level : 'Simpan'})</label><input type="number" id="siP${t.price_level}" class="form-control si-p-in" data-lvl="${t.price_level}" min="0" placeholder="Kosongkan jika belum diisi"></div>`).join('')}

function siAddItem(pid) {
  const p = findProduct(pid); if (!p) return;
  const ex = SI_DRAFT.items.find(i => i.id === pid);
  if (ex) ex.qty += 1;
  else {
    const pr = {};
    tierLevels().forEach(l => { pr[l] = hasPrice(p, l) ? Number(p.prices[l]) : 0; });
    SI_DRAFT.items.push({ id: p.id, qty: 1, cost: Number(p.base_price) || 0, origCost: Number(p.base_price) || 0, prices: pr });
  }
  $('#siItemResults')?.classList.remove('show');
  if ($('#siItemSearch')) $('#siItemSearch').value = '';
  siRenderRows();
}
function siUpdateRow(idx, field, val) {
  const it = SI_DRAFT.items[idx]; if (!it) return;
  if (field === 'qty') it.qty = Math.max(1, parseInt(val) || 1);
  else if (field === 'cost') {
    const newCost = Math.max(0, parseInt(val) || 0);
    const changed = newCost !== it.cost || newCost !== it.origCost;
    it.cost = newCost;
    siRenderRows();
    if (changed) openSiPriceModal(idx);
    return;
  }
  siRenderRows();
}
function siRemoveRow(idx) { SI_DRAFT.items.splice(idx, 1); siRenderRows(); }
function siRenderRows() {
  const tb = $('#siItemsBody'); if (!tb) return;
  tb.innerHTML = SI_DRAFT.items.length ? SI_DRAFT.items.map((it, i) => {
    const p = findProduct(it.id);
    const changed = it.cost !== it.origCost;
    return `<tr>
      <td>${i + 1}</td>
      <td><div style="font-weight:600;">${esc(p?.name || '-')}</div><div style="font-size:.73rem;color:var(--gray-mid);font-family:var(--font-mono);">${esc(p?.item_code || '-')} · Stok saat ini: ${p?.current_stock || 0} · Modal lama: ${rp(it.origCost)}</div></td>
      <td><div class="bo-qty-wrap"><button type="button" class="pos-qty-btn" onclick="siUpdateRow(${i},'qty',${it.qty - 1})">-</button><input type="number" class="bo-num-in" min="1" value="${it.qty}" onchange="siUpdateRow(${i},'qty',this.value)"><button type="button" class="pos-qty-btn" onclick="siUpdateRow(${i},'qty',${it.qty + 1})">+</button></div></td>
      <td><input type="number" class="bo-num-in bo-price-in" min="0" value="${it.cost}" onchange="siUpdateRow(${i},'cost',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();siUpdateRow(${i},'cost',this.value);}">${changed ? `<div style="font-size:.68rem;color:var(--orange);margin-top:2px;">Modal berubah</div>` : ''}</td>
      <td style="text-align:right;font-family:var(--font-mono);font-weight:600;">${rp(it.qty * it.cost)}</td>
      <td style="white-space:nowrap;"><button type="button" class="btn btn-sm btn-outline" onclick="openSiPriceModal(${i})">4 Harga</button><button type="button" class="btn btn-sm" style="background:transparent;border:1px solid #dc3545;color:#dc3545;margin-left:.35rem;" onclick="siRemoveRow(${i})">Hapus</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Belum ada barang. Cari dan pilih barang di atas.</td></tr>';
  const tot = SI_DRAFT.items.reduce((a, it) => a + it.qty * it.cost, 0);
  if ($('#siTotalCost')) $('#siTotalCost').textContent = rp(tot);
}
function openSiPriceModal(idx) {
  const it = SI_DRAFT.items[idx]; if (!it) return;
  const p = findProduct(it.id);
  SI_DRAFT.editIdx = idx;
  $('#siPriceSub').innerHTML = `<strong>${esc(p?.name || '')}</strong><br>Modal Lama: ${rp(it.origCost)} &rarr; Modal Baru: <strong style="color:var(--orange);">${rp(it.cost)}</strong>`;
  tierLevels().forEach(l => { const el = $('#siP' + l); if (el) el.value = it.prices[l] > 0 ? it.prices[l] : ''; });
  openModal('siPriceModal');
  const firstIn = $('#siPriceFields .si-p-in');
  setTimeout(() => { firstIn?.focus(); firstIn?.select(); }, 40);
}
function saveSiPrices() {
  const it = SI_DRAFT.items[SI_DRAFT.editIdx];
  if (it) {
    tierLevels().forEach(l => { const v = parseInt($('#siP' + l)?.value); it.prices[l] = v > 0 ? v : 0; });
  }
  closeModal('siPriceModal');
  siRenderRows();
  adminToast('success', 'Level harga jual disimpan ke draft stok masuk.');
}
function siSave() {
  if (!SI_DRAFT.items.length) return adminToast('error', 'Tambahkan minimal 1 barang stok masuk.');
  const ref = ($('#siRef')?.value || '').trim() || ('IN-' + randStr(6));
  const sup = ($('#siSupplier')?.value || '').trim() || null;
  const note = ($('#siNotes')?.value || '').trim() || null;
  const dtVal = $('#siDate')?.value;
  const createdAt = dtVal ? new Date(dtVal).toISOString() : nowIso();
  SI_DRAFT.items.forEach(it => {
    const p = findProduct(it.id); if (!p) return;
    p.current_stock += it.qty;
    p.base_price = it.cost;
    tierLevels().forEach(l => { if (it.prices[l] > 0) p.prices[l] = it.prices[l]; });
    p.updated_at = nowIso();
    DB.stock_movements.push({ id: nextId('stock_movements'), ref, product_id: p.id, type: 'in', quantity: it.qty, cost: it.cost, supplier: sup, notes: note, created_at: createdAt });
  });
  save(); rerender();
  adminToast('success', `Stok masuk ${ref} (${SI_DRAFT.items.length} item) berhasil disimpan.`);
}

function boAddItem(pid) {
  const p = findProduct(pid); if (!p) return;
  if (p.current_stock <= 0) return adminToast('error', `Stok ${p.name} sedang habis.`);
  const ex = BO_DRAFT.items.find(i => i.id === pid);
  if (ex) {
    if (ex.qty + 1 > p.current_stock) return adminToast('error', `Stok ${p.name} hanya ${p.current_stock} pcs.`);
    ex.qty += 1;
  } else {
    const u = BO_DRAFT.custId ? findUser(BO_DRAFT.custId) : null;
    const lvl = u ? mapGroupToLevel(u.customer_group) : 1;
    const pVal = hasPrice(p, lvl) ? Number(p.prices[lvl]) : 0;
    BO_DRAFT.items.push({ id: p.id, qty: 1, price: pVal, disc: 0 });
  }
  $('#boItemResults')?.classList.remove('show');
  if ($('#boItemSearch')) $('#boItemSearch').value = '';
  boRenderRows();
}
function boUpdateRow(idx, field, val) {
  const it = BO_DRAFT.items[idx]; if (!it) return;
  const p = findProduct(it.id);
  if (field === 'qty') {
    const q = Math.max(1, parseInt(val) || 1);
    if (p && q > p.current_stock) { adminToast('error', `Stok maksimal ${p.current_stock} pcs.`); it.qty = p.current_stock; }
    else it.qty = q;
  } else if (field === 'price') it.price = Math.max(0, parseInt(val) || 0);
  else if (field === 'disc') it.disc = Math.min(100, Math.max(0, parseFloat(val) || 0));
  boRenderRows();
  if ((field === 'price' || field === 'disc') && p) {
    const net = Math.round(it.price * (1 - (it.disc || 0) / 100));
    if (net < (Number(p.base_price) || 0)) showBoLossWarning(idx, p, it.price, net);
  }
}

          <button type="button" id="boLossEditBtn" class="btn" style="flex:1;background:#E8521A;color:#fff;border:none;padding:.6rem;border-radius:4px;font-weight:600;cursor:pointer;">Ubah Harga</button>

      <div>Harga Jual Anda: <strong style="color:#ff6b6b;">${rp(netPrice)}</strong></div>
      <div>Selisih Rugi: <strong style="color:#ff6b6b;">-${rp(loss)} / ${esc(p.unit)}</strong></div>

  $('#boLossEditBtn').onclick = () => {
    $('#boLossModal').style.display = 'none';

function boRemoveRow(idx) { BO_DRAFT.items.splice(idx, 1); boRenderRows(); }
function boRowSub(it) { return Math.round(it.qty * it.price * (1 - (it.disc || 0) / 100)); }
function boRenderRows() {

      <td><input type="number" class="bo-num-in bo-price-in" min="0" value="${it.price}" onchange="boUpdateRow(${i},'price',this.value)">${isLoss ? `<div class="bo-loss-badge">&#9888; Rugi -${rp((Number(p.base_price) || 0) - net)}</div>` : ''}</td>

    </tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Belum ada barang. Cari dan pilih barang di atas.</td></tr>';

}
function boRecalc() {
  const sub = BO_DRAFT.items.reduce((a, it) => a + boRowSub(it), 0);
  const disc = Math.max(0, parseInt($('#boGlobalDisc')?.value) || 0);
  const ship = Math.max(0, parseInt($('#boShipping')?.value) || 0);
  const total = Math.max(0, sub - disc + ship);
  const pay = $('#boPayment')?.value || 'cash';
  const dp = Math.max(0, parseInt($('#boDp')?.value) || 0);
  if ($('#boSumSub')) $('#boSumSub').textContent = rp(sub);
  if ($('#boSumDisc')) $('#boSumDisc').textContent = '-' + rp(disc);
  if ($('#boSumShip')) $('#boSumShip').textContent = rp(ship);
  if ($('#boSumTotal')) $('#boSumTotal').textContent = rp(total);
  if ($('#boBalLabel') && $('#boSumBal')) {
    if (pay === 'bon') {
      $('#boBalLabel').textContent = 'Sisa Tagihan (Bon)';
      $('#boSumBal').textContent = rp(Math.max(0, total - dp));
    } else {
      const chg = dp > 0 ? dp - total : 0;
      $('#boBalLabel').textContent = chg >= 0 ? 'Kembalian' : 'Kurang Bayar';
      $('#boSumBal').textContent = rp(Math.abs(chg));
    }
  }
}
function boSave(shouldPrint) {
  if (!BO_DRAFT.items.length) return adminToast('error', 'Tambahkan minimal 1 barang ke nota.');
  for (const it of BO_DRAFT.items) {
    const p = findProduct(it.id);
    if (!p || it.qty > p.current_stock) return adminToast('error', `Stok ${p ? p.name : 'produk'} tidak mencukupi.`);
  }
  const inv = ($('#boInvNo')?.value || '').trim() || ('BO-' + randStr(6));
  const sub = BO_DRAFT.items.reduce((a, it) => a + boRowSub(it), 0);
  const disc = Math.max(0, parseInt($('#boGlobalDisc')?.value) || 0);
  const ship = Math.max(0, parseInt($('#boShipping')?.value) || 0);
  const total = Math.max(0, sub - disc + ship);
  const pay = $('#boPayment')?.value || 'cash';
  const dp = Math.max(0, parseInt($('#boDp')?.value) || 0);
  const u = BO_DRAFT.custId ? findUser(BO_DRAFT.custId) : null;
  const addr = ($('#boAddress')?.value || '').trim() || (u ? (u.address || u.name) : 'Walk-in Customer');
  const dtVal = $('#boDate')?.value;
  const createdAt = dtVal ? new Date(dtVal).toISOString() : nowIso();
  const tid = nextId('transactions');
  DB.transactions.push({
    id: tid, invoice_number: inv, user_id: u ? u.id : null, total_amount: total,
    status: pay === 'bon' ? 'pending' : 'processing',
    payment_method: pay === 'bon' ? 'Kredit / Bon' : pay === 'transfer' ? 'Transfer / Midtrans' : 'Tunai',
    shipping_address: addr, snap_token: null, created_at: createdAt,
    sales_name: ($('#boSales')?.value || '').trim() || 'Admin Partlyfe',
    due_date: pay === 'bon' ? ($('#boDueDate')?.value || null) : null,
    dp_amount: dp, discount_amount: disc, shipping_cost: ship,
    note: ($('#boNote')?.value || '').trim() || null
  });
  BO_DRAFT.items.forEach(it => {
    const p = findProduct(it.id); p.current_stock -= it.qty;
    const unitNet = Math.round(it.price * (1 - (it.disc || 0) / 100));
    DB.transaction_details.push({ id: nextId('transaction_details'), transaction_id: tid, product_id: it.id, qty: it.qty, price: unitNet });
  });
  if (u) { u.total_spent = Number(u.total_spent) + total; checkLevelUpgrade(u); }
  save();
  toast('success', 'Nota Tersimpan', `Faktur ${inv} berhasil dibuat.`);
  go('#/admin/orders/' + tid);
  if (shouldPrint) setTimeout(() => openAdminPrintModal(tid, pay === 'bon' ? 'bon' : 'long'), 80);
}

function executeAdminPrint() {

function downloadAdminPrintPdf() {

      doc.setFont('courier', 'bold'); doc.setFontSize(11);

      if (isBon && o.dp_amount) { doc.setFont('courier', 'normal'); doc.setFontSize(9.5); doc.text('DP / Dibayar:', R - 130, y); doc.text(rp(o.dp_amount), R - 2, y, { align: 'right' }); y += 13; doc.setFont('courier', 'bold'); doc.text('Sisa Bon:', R - 130, y); doc.text(rp(Math.max(0, o.total_amount - o.dp_amount)), R - 2, y, { align: 'right' }); y += 15; }
    }
    if (note) { doc.setFont('courier', 'normal'); doc.setFontSize(9); doc.text(`Catatan: ${note}`, L, y); y += 16; }
    y += 28;
    doc.setFont('courier', 'normal'); doc.setFontSize(9);
    if (isSJ) {
      doc.text('( Gudang / Pengirim )', L + 40, y, { align: 'center' });
      doc.text('( Kurir / Supir )', W / 2, y, { align: 'center' });
      doc.text('( Penerima )', R - 40, y, { align: 'center' });
    } else {
      doc.text(isBon ? '( Yang Menerima / Bon )' : '( Penerima )', L + 70, y, { align: 'center' });
      doc.text('( Hormat Kami )', R - 70, y, { align: 'center' });
    }
  }
  const fname = `${isSJ ? 'SuratJalan' : 'Nota'}-${o.invoice_number}.pdf`;
  doc.save(fname);
  adminToast('success', `PDF ${fname} berhasil diunduh.`);
}

function openAssignTier(uid) {
  const u = findUser(uid); $('#tierForm').reset(); $('#userName').textContent = u.name; $('#tierUserId').value = uid;
  const t = activeTier(u); if (t) $('#tier_id').value = t.id;
  openModal('tierModal');
}
function assignTier(uid, tierId, expires) { // AdminController@assignTier
  const u = findUser(uid), tier = findTier(tierId);
  if (!u || !tier) return adminToast('error', 'Validasi gagal: The tier id field is required.');
  let exp = null;
  if (expires) { exp = new Date(expires + 'T23:59:59'); const t0 = new Date(); t0.setHours(23, 59, 59, 0); if (exp <= t0) return adminToast('error', 'Validasi gagal: The expires at field must be a date after today.'); }
  const now = nowIso();
  const existing = DB.tier_assignments.find(a => a.user_id === uid && a.customer_tier_id === tierId);
  DB.tier_assignments.forEach(a => { if (a.user_id === uid && isActiveAssignment(a) && a !== existing) a.expires_at = now; });
  if (existing) existing.expires_at = exp ? exp.toISOString() : null;
  else DB.tier_assignments.push({ id: nextId('tier_assignments'), user_id: uid, customer_tier_id: tierId, assigned_at: now, expires_at: exp ? exp.toISOString() : null, created_at: now });
  const expiryText = exp ? ` (berlaku sampai ${fmtDate(exp.toISOString(), 'd/m/Y')})` : ' (permanen)';
  notify(uid, 'Level Harga Diperbarui', `Anda mendapatkan level harga ${tier.name}${expiryText}.`, 'promo');
  save(); closeModal('tierModal'); rerender();
  adminToast('success', `Level harga ${tier.name} berhasil diberikan kepada ${u.name}.`);
}

function openTierEditor(id) {

function saveTier() { // store/updateCustomerTier (level otomatis bertambah, produk lama kosong untuk level baru)
  const id = Number($('#tierId').value) || null, name = $('#tier_name').value.trim(), desc = $('#description').value.trim() || null;
  if (!name) return adminToast('error', 'Nama level wajib diisi.');
  const slug = slugify(name);
  if (DB.customer_tiers.some(t => t.slug === slug && t.id !== id)) return adminToast('error', 'Gagal: nama level sudah dipakai (slug harus unik).');
  if (id) Object.assign(findTier(id), { name, slug, discount_percent: 0, description: desc });
  else {
    const nextLvl = Math.max(0, ...DB.customer_tiers.map(t => Number(t.price_level) || 0)) + 1;
    DB.customer_tiers.push({ id: nextId('customer_tiers'), name, slug, price_level: nextLvl, discount_percent: 0, min_purchase: 0, description: desc });
  }
  save(); closeModal('tierEditModal'); rerender();
  adminToast('success', id ? 'Level harga customer berhasil diperbarui.' : 'Level harga baru ditambahkan. Harga produk lama untuk level ini dibiarkan kosong.');

function deleteTier(id) {

    if (DB.tier_assignments.some(a => a.customer_tier_id === id)) return adminToast('error', 'Level harga tidak dapat dihapus karena masih digunakan oleh customer.');
    DB.customer_tiers = DB.customer_tiers.filter(t => t.id !== id); save(); rerender(); adminToast('success', 'Level harga customer berhasil dihapus.');
  });
}
