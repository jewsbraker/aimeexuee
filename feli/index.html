    return obj;
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Produk & Stok');
  XLSX.writeFile(wb, 'Katalog-Produk-Partlyfe.xlsx');
  adminToast('success', `Export berhasil (${rows.length} produk).`);
}
function importProductsExcel(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (!window.XLSX) { input.value = ''; return adminToast('error', 'Library Excel belum termuat (cek koneksi internet).'); }
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      let updated = 0, added = 0;
      rows.forEach(r => {
        const code = String(r.item_code || r.SKU || r.kode || '').trim();
        const name = String(r.name || r.nama || '').trim();
        if (!code && !name) return;
        const catName = String(r.category || r.kategori || '').trim().toLowerCase();
        const catObj = DB.categories.find(c => c.name.toLowerCase() === catName || String(c.id) === catName);
        const stock = Math.max(0, parseInt(r.current_stock ?? r.stok ?? 0) || 0);
        const base = Math.max(0, parseInt(r.base_price ?? r.harga_modal ?? 0) || 0);
        const prices = {};
        tierLevels().forEach(l => { const v = parseInt(r['price_level_' + l] ?? r['level_' + l] ?? 0); if (v > 0) prices[l] = v; });
        const ex = code ? DB.products.find(p => p.item_code.toLowerCase() === code.toLowerCase()) : null;
        if (ex) {
          if (name) ex.name = name;
          if (r.brand) ex.brand = String(r.brand).trim();
          if (catObj) ex.category_id = catObj.id;
          if (r.unit) ex.unit = String(r.unit).trim();
          if (!isNaN(parseInt(r.base_price ?? r.harga_modal))) ex.base_price = base;
          if (r.current_stock !== '' || r.stok !== undefined) ex.current_stock = stock;
          if (Object.keys(prices).length) ex.prices = { ...ex.prices, ...prices };
          ex.updated_at = nowIso();
          updated++;
        } else if (name) {
          const gen = code || ('PRD-' + randStr(8));
          DB.products.push({
            id: nextId('products'), category_id: catObj ? catObj.id : (DB.categories[0]?.id || 1),
            item_type: 'barang', item_code: gen, barcode: gen, name,
            brand: String(r.brand || 'Umum').trim(), unit: String(r.unit || 'PCS').trim(),
            base_price: base, current_stock: stock, cashback_percent: 0,
            prices: Object.keys(prices).length ? prices : { 1: Math.round(base * 1.25) },
            images: [], created_at: nowIso()
          });
          added++;
        }
      });
      save(); input.value = ''; renderAdminProductsList(1);
      adminToast('success', `Import Excel selesai: ${updated} diperbarui, ${added} ditambahkan.`);
    } catch (err) {
      input.value = '';
      adminToast('error', 'File Excel tidak valid atau gagal dibaca.');
    }
  };
  rd.readAsArrayBuffer(file);
}

const CACHE = {}; // urutan acak tetap selama berada di halaman yang sama
function stableShuffle(key, arr) {
  if (!CACHE[key]) CACHE[key] = shuffle(arr).map(x => x.id);
  return CACHE[key].map(id => arr.find(x => x.id === id)).filter(Boolean);
}

function addToCart(productId, qty = 1) { // CustomerController@addToCart
  if (!requireLogin('Login dulu untuk menambahkan ke keranjang.')) return;

  const c = DB.carts.find(x => x.user_id === u.id && x.product_id === p.id);
  if ((c ? c.qty : 0) + qty > p.current_stock) return toast('error', 'Gagal', `Stok tidak cukup. Sisa stok: ${p.current_stock} pcs.`);
  if (c) c.qty += qty; else DB.carts.push({ id: nextId('carts'), user_id: u.id, product_id: p.id, qty, created_at: nowIso() });

function updateCartQty(cartId, delta) { // updateCartQty

function buyNow(productId) {
  // Demo: langsung ke checkout ?product_id&qty (didukung CustomerController@checkout) tanpa menghapus isi keranjang lain.
  if (!requireLogin()) return;
  const u = me(), p = findProduct(productId), qty = readQty();
  if (p.current_stock < qty || p.current_stock <= 0) return toast('error', 'Gagal', `Stok tidak cukup. Sisa stok: ${p.current_stock} pcs.`);
  notify(u.id, 'Beli Langsung', `Anda memulai pembelian langsung: ${p.name} (x${qty}).`, 'system');

function initiatePayment(productId, qty) { // CustomerController@initiatePayment + paymentCallback
  const u = me(), lvl = tierLevel(), lines = [];
  if (productId) {
    const p = findProduct(productId);
    if (!p || p.current_stock < qty) return toast('error', 'Error', `Stok ${p ? p.name : ''} tidak cukup. Sisa: ${p ? p.current_stock : 0} pcs.`);
    lines.push({ p, qty });
  } else {
    const cart = cartOf(u.id); if (!cart.length) return toast('error', 'Error', 'Keranjang kosong.');
    for (const c of cart) { const p = findProduct(c.product_id); if (!p) continue;
      if (p.current_stock < c.qty) return toast('error', 'Error', `Stok ${p.name} tidak cukup. Sisa: ${p.current_stock} pcs.`);
      lines.push({ p, qty: c.qty }); }
  }
  let gross = 0; const dets = [];
  lines.forEach(({ p, qty }) => { const price = checkoutPrice(p, lvl); if (price > 0) { dets.push({ product_id: p.id, qty, price }); gross += price * qty; } });
  if (gross <= 0) return toast('error', 'Error', 'Total tagihan Rp 0.');
  const orderId = `TRX-${Math.floor(Date.now() / 1000)}-${u.id}`, tid = nextId('transactions');
  DB.transactions.push({ id: tid, invoice_number: orderId, user_id: u.id, total_amount: gross, status: 'pending', payment_method: null, shipping_address: u.address || null, snap_token: 'demo-' + randStr(12), created_at: nowIso() });
  dets.forEach(d => DB.transaction_details.push({ id: nextId('transaction_details'), transaction_id: tid, ...d }));
  if (!productId) DB.carts = DB.carts.filter(c => c.user_id !== u.id);
  save(); refreshShopNav();
  snapPay({ id: orderId, amount: gross }, {
    onSuccess: () => { paymentCallback(orderId, 'settlement'); toast('success', 'Berhasil!', 'Pembayaran berhasil diproses.'); setTimeout(() => go('#/transactions'), 1500); },
    onPending: () => { toast('success', 'Pending', 'Menunggu pembayaran.'); setTimeout(() => go('#/transactions'), 1500); },
    onClose: () => { go('#/transactions', ['info', 'Popup ditutup', `Transaksi ${orderId} tersimpan dengan status pending.`]); }
  });
}
function paymentCallback(orderId, status) {
  const t = DB.transactions.find(x => x.invoice_number === orderId); if (!t) return;
  if (['settlement', 'capture'].includes(status) && ['pending', 'expire', 'cancel'].includes(t.status)) {
    t.status = 'processing';
    detailsOf(t.id).forEach(d => { const p = findProduct(d.product_id); if (p) p.current_stock = Math.max(0, p.current_stock - d.qty); });
    notify(t.user_id, 'Pembayaran Berhasil', `Pembayaran untuk invoice ${orderId} telah dikonfirmasi.`, 'system');
  } else if (['cancel', 'expire', 'deny'].includes(status)) t.status = 'cancelled';
  save();
}

function doRegister(form) {

  if (pw.length < 6) errors.password = 'The password field must be at least 6 characters.';

  if (Object.keys(errors).length) { FORM = { page: 'register', errors, old: o }; return rerender(); }
  const u = { id: nextId('users'), name: o.name, email: o.email, password: pw, role: 'customer', phone: o.phone || null, address: null, customer_group: 'poin', total_spent: 0, created_at: nowIso() };

let pendingFlash = null;
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const i = h.indexOf('?'), path = (i < 0 ? h : h.slice(0, i)).replace(/\/+$/, '') || '/';
  return { path, query: Object.fromEntries(new URLSearchParams(i < 0 ? '' : h.slice(i + 1))) };
}
function go(hash, flash) {
  if (flash) pendingFlash = flash;
  if (location.hash === hash) render(); else location.hash = hash;
}
function render(keep = false) {
  const { path, query } = parseHash(), u = me();
  let res = null, found = null;
  for (const r of ROUTES) { const m = path.match(r[0]); if (m) { found = [r, m]; break; } }
  if (!found) res = page404();
  else {
    const [[, fn, opt = {}], m] = found;
    if ((opt.auth || opt.admin) && !u) { DB.session.intended = location.hash; save(); return go('#/login', ['info', 'Silakan masuk', 'Silakan login terlebih dahulu.']); }
    if (opt.guest && u) return go(u.role === 'admin' ? '#/admin/dashboard' : '#/');
    try {
  res = (opt.admin && u.role !== 'admin') ? page403() : fn(query, ...m.slice(1).map(decodeURIComponent));
} catch (err) {
  console.error(err);
  res = errorPage(500, 'Error: ' + err.message);
}
  }
  if (res.redirect) return go(res.redirect, res.flash);
  const y = window.scrollY, am = $('.admin-main'), ay = am ? am.scrollTop : 0;
  window.__ph = [];
  $('#app').innerHTML = res.shell === 'admin' ? adminShell(res) : shopShell(res);
  document.title = res.shell === 'admin' ? (res.title || 'Admin Partlyfe') : `${res.title || 'Partlyfe'} — Sparepart Motor`;
  if (res.shell === 'admin') bindAdminShell(); else bindShopShell();
  if (res.after) res.after();
  if (keep) { window.scrollTo(0, y); const am2 = $('.admin-main'); if (am2) am2.scrollTop = ay; }
  else { window.scrollTo(0, 0); }
  if (pendingFlash) { const f = pendingFlash; pendingFlash = null; toast(...f); }
}
