<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Graduation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Fredoka:wght@500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Fredoka",system-ui,sans-serif;background:linear-gradient(180deg,#1c0e38 0%,#4b2060 55%,#e0648f 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#bk{z-index:1}#gl{z-index:2;pointer-events:auto}#fx{z-index:3}
#title{position:fixed;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 4vh);text-align:center;pointer-events:none;transition:opacity .8s}
#title.hide{opacity:0}
#t1{font-family:"Pinyon Script",cursive;font-size:clamp(38px,12vw,100px);line-height:1.05;color:#fff1cf;text-shadow:0 0 22px #ffc46a99}
#t1 span{display:inline-block;margin:0 .08em;opacity:0;filter:blur(12px);transform:translateY(16px);animation:rise 1.4s var(--d) cubic-bezier(.2,.8,.2,1) forwards}
#t2{margin-top:4px;font-size:clamp(14px,4vw,20px);color:#ffc2d4;opacity:0;animation:rise 1.2s 1.2s forwards}
@keyframes rise{to{opacity:1;filter:none;transform:none}}
#hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-size:14px;color:#fff3d6;padding:8px 16px;border-radius:999px;background:#3d1a63;border:2px solid #ffc2d4;box-shadow:0 4px 14px #0008;pointer-events:none;transition:opacity .5s}
#fl{position:fixed;inset:0;z-index:6;background:#fff;opacity:0;pointer-events:none}
#fl.on{opacity:1}#fl{transition:opacity 1.1s}#fl.on{transition:none}
.ui{position:fixed;z-index:7;border:2px solid #ffc2d4;background:#3d1a63;color:#fff;font:500 15px "Fredoka",sans-serif;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px #0008}
#snd{right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;font-size:18px}
#rp{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding:10px 20px;display:none}
.word{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font:600 clamp(17px,4.6vw,24px) "Fredoka",sans-serif;color:#fff;text-shadow:0 0 12px #ff5f96,0 2px 6px #0008;animation:fl 1.8s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-300%)}}
.ov{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:22px;background:#070312dd}
.ov.open{display:flex}
.paper{position:relative;border:3px solid #e8a6b8;width:min(440px,100%);max-height:88vh;overflow:auto;touch-action:pan-y;padding:34px 26px 24px;border-radius:6px;background:#fff8ef;box-shadow:0 20px 60px #000a;transform:rotate(-1deg);animation:slide .8s cubic-bezier(.2,1.2,.3,1)}
@keyframes slide{from{opacity:0;transform:translateY(60px) rotate(-4deg) scale(.9)}}
.paper .to{font:600 22px "Caveat",cursive;color:#b5496b}
.paper .nm{font:400 clamp(34px,10vw,48px)/1.1 "Pinyon Script",cursive;color:#b5496b;text-align:center;margin:8px 0 0}
.paper .dg{font:600 15px "Fredoka",sans-serif;color:#a8741f;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 14px}
.paper #msg{font:600 clamp(20px,5.4vw,25px)/1.35 "Caveat",cursive;color:#5a2a46;white-space:pre-wrap;min-height:120px}
.paper .sig{font:600 20px "Caveat",cursive;text-align:right;margin-top:12px;opacity:0;transition:opacity 1s;color:#b5496b}
.paper .sig.on{opacity:1}
.xb{position:absolute;top:8px;right:10px;border:0;background:#ffe0e8;font:600 13px "Fredoka",sans-serif;color:#b5496b;cursor:pointer;padding:5px 12px;border-radius:999px}
</style>
</head>
<body>
<canvas id="bk"></canvas><canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="title"><div id="t1"></div><div id="t2">Tekan gedung kampus untuk memulai 🎓</div></div>
<div id="hint"></div><div id="fl"></div>
<button class="ui" id="snd" aria-label="Suara">🔔</button>
<button class="ui" id="rp">🔁 Bangun lagi</button>
<div id="letter" class="ov"><div class="paper"><button class="xb">Tutup</button>
<div class="to" id="to"></div><div class="nm" id="nm"></div><div class="dg" id="dg"></div><p id="msg"></p><p class="sig" id="sig"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
/* ===== UBAH BAGIAN INI ===== */
var NAME='Gattan', DEG='S.M.', DEGFULL='Sarjana Management';
var FROM='From: The Best Person 2nd';
var MESSAGE='Selamat wisuda, Gattan! 🎓\n\nHari ini kamu resmi menyandang gelar Sarjana Management. Semua kerja keras, begadang, dan tugas yang rasanya tak ada habisnya akhirnya terbayar.\n\nSemoga ilmu yang kamu bawa jadi bekal untuk langkah berikutnya, dan semoga semua yang kamu cita-citakan satu per satu tercapai.\n\nCongratulations, proud of you!';
var MUSIC='../I Do.mp3', MUSIC_START=15;
/* =========================== */
var $=function(i){return document.getElementById(i)},rnd=function(a,b){return a+Math.random()*(b-a)};
var hint=$('hint');
if(!window.THREE){hint.textContent='Buka dengan internet ya, supaya gedung 3D-nya bisa muncul';return}
[['Happy',0],['Graduation',350]].forEach(function(w){var s=document.createElement('span');s.textContent=w[0];s.style.setProperty('--d',w[1]+'ms');$('t1').appendChild(s)});
$('to').textContent='Dear '+NAME+',';$('nm').textContent=NAME+', '+DEG;$('dg').textContent=DEGFULL;$('sig').textContent=FROM;

/* ---------- suara ---------- */
var AC=null,snd=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,v,ty,f2){if(!snd)return;var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function boom(big){if(!snd)return;var a=ac();if(!a)return;var n=a.sampleRate*(big?1.8:.4),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=big?600:250;g.gain.value=big?1:.55;s.connect(f);f.connect(g);g.connect(a.destination);s.start();tone(big?120:90,big?1.2:.3,big?.5:.3,'sine',30)}
var bgm=null;
function music(){if(bgm)return;bgm=new Audio(MUSIC);bgm.loop=true;bgm.volume=.9;bgm.currentTime=MUSIC_START;bgm.play().catch(function(){});setInterval(function(){bgm.muted=!snd;if(document.hidden)bgm.pause();else if(bgm.paused)bgm.play().catch(function(){})},400)}
$('snd').addEventListener('click',function(){snd=!snd;this.textContent=snd?'🔔':'🔕'});
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}

/* ---------- Three.js ---------- */
var W,H,dpr,S=.045,BX=25*S;
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);
var ren=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true});ren.setClearColor(0,0);
scene.add(new THREE.HemisphereLight(0xfff2ea,0x7a9a5a,.95));
var sun=new THREE.DirectionalLight(0xfff4e0,.85);sun.position.set(6,12,8);scene.add(sun);
var rim=new THREE.DirectionalLight(0xff9ec8,.5);rim.position.set(-6,4,-6);scene.add(rim);
var bk=$('bk').getContext('2d'),fx=$('fx').getContext('2d');
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;ren.setPixelRatio(dpr);ren.setSize(W,H,false);
  ['bk','fx'].forEach(function(k){$(k).width=W*dpr;$(k).height=H*dpr});[bk,fx].forEach(function(c){c.setTransform(dpr,0,0,dpr,0,0)});
  cam.aspect=W/H;var t=Math.tan(cam.fov*Math.PI/360),d=Math.max(4.8/t,3.7/(t*cam.aspect))*1.08;
  cam.position.set(d*.3,3.3+d*.12,d);cam.lookAt(0,2.6,0);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

var root=new THREE.Group();scene.add(root);
var mc={};
function M(c){return mc[c]||(mc[c]=new THREE.MeshStandardMaterial({color:c,roughness:.5}))}
var UB=new THREE.BoxGeometry(1,1,1);
/* tanah + pohon */
var gr=new THREE.Mesh(new THREE.CylinderGeometry(7.2,7.2,.3,64),M('#6d9b55'));gr.position.y=-.15;root.add(gr);
var rd=new THREE.Mesh(new THREE.BoxGeometry(14,.02,.9),M('#4f555b'));rd.position.set(0,.01,2.9);root.add(rd);
for(var i=0;i<18;i++){var tx=rnd(-6.2,6.2),tz=rnd(3.6,6);var tr=new THREE.Mesh(new THREE.SphereGeometry(rnd(.3,.5),8,6),M('#4f8a3a'));tr.position.set(tx,.55,tz);var tk=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.4,6),M('#5b4630'));tk.position.set(tx,.2,tz);root.add(tr,tk)}

/* ---------- model gedung UC ---------- */
function tex(f){var c=document.createElement('canvas');c.width=c.height=64;f(c.getContext('2d'));var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
var TX={
 dark:function(){return tex(function(g){g.fillStyle='#15212b';g.fillRect(0,0,64,64);g.fillStyle='#2c4457';g.fillRect(3,8,58,42);g.fillStyle='#6f8da3';g.fillRect(3,8,58,4);g.fillStyle='#aab6bf';g.fillRect(0,56,64,8)})},
 white:function(){return tex(function(g){g.fillStyle='#f3f3f1';g.fillRect(0,0,64,64);g.fillStyle='#55626b';g.fillRect(8,10,48,34);g.fillStyle='#7e8e98';g.fillRect(8,10,48,6);g.fillStyle='#d9d9d6';g.fillRect(0,52,64,12)})},
 grey:function(){return tex(function(g){g.fillStyle='#c9cbcc';g.fillRect(0,0,64,64);g.fillStyle='#6c7a84';g.fillRect(10,12,44,36)})},
 orange:function(){return tex(function(g){g.fillStyle='#f2f2ee';g.fillRect(0,0,64,64);g.fillStyle='#e8762c';g.fillRect(4,6,56,52);g.fillStyle='#fff';for(var i=0;i<3;i++)g.fillRect(10+i*18,18,10,30)})},
 beige:function(){return tex(function(g){g.fillStyle='#d8c79c';g.fillRect(0,0,64,64);g.fillStyle='#5c6f78';g.fillRect(4,16,56,34);g.fillStyle='#b99d62';g.fillRect(0,56,64,8)})}
};
function bx(w,h,d,x,y,z,c,p){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.5}));m.position.set(x,y+h/2,z);m.userData.c=c;p.add(m);return m}
function wl(w,h,d,x,y,z,tf,cw,fh,c,p){
  var fl=Math.round(h/fh),ms=[];
  for(var i=0;i<6;i++){if(i===2||i===3){ms.push(new THREE.MeshStandardMaterial({color:0x8d969c}));continue}var t=tf();t.repeat.set(Math.max(1,Math.round(((i<2)?d:w)/cw)),fl);ms.push(new THREE.MeshStandardMaterial({map:t,roughness:.3,metalness:.2}))}
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ms);m.position.set(x,y+h/2,z);m.userData.c=c;p.add(m);return m}
function buildUC(){
  var R=new THREE.Group(),DX=-14,WX=22;
  wl(30.4,16,26.4,DX,0,0,function(){return TX.beige()},3,4,'#c9c4b8',R);
  bx(30.6,2.5,26.6,DX,14,0,'#d7d7d4',R);bx(26,1.4,6,DX,12.5,16,'#5e8a3a',R);bx(5,3,.4,DX+6,6,13.3,'#c9252c',R);
  wl(22,84,22,DX,16,0,TX.dark,1.6,3.5,'#2c4457',R);bx(23,1.2,23,DX,100,0,'#aebbc5',R);
  var rf=bx(23,2.2,23,DX,101,0,'#3f6b8c',R);rf.rotation.z=.07;bx(1.6,92,23,DX-11.4,16,0,'#f4f4f2',R);
  bx(34,18,28,WX,0,-2,'#f1f1ee',R);bx(26.4,5,.4,WX-2,6,12.2,'#1c2630',R);
  wl(26,110,24,WX,18,-2,TX.white,2.3,3.4,'#ccd0d3',R);bx(27,1.8,25,WX,128,-2,'#ffffff',R);bx(14,3,10,WX+3,129.8,-2,'#dcdcdc',R);bx(2,126,24.4,WX+14,0,-2,'#f8f8f6',R);
  wl(18,64,18,-48,0,-38,TX.grey,2.4,3.4,'#a9adb0',R);wl(14,60,18,-32,0,-40,TX.grey,2.4,3.4,'#a9adb0',R);bx(2,66,18,-56.8,0,-38,'#e9eaea',R);
  var o=wl(44,20,14,-62,0,22,TX.orange,3.4,4,'#ee8a46',R);o.rotation.y=-.18;
  wl(26,22,16,-34,0,26,TX.beige,3.2,3.6,'#d8c79c',R);bx(18,14,14,-14,0,30,'#a7a49f',R);
  R.scale.setScalar(S);R.position.x=BX;return R}
var bld=buildUC();root.add(bld);
var deb=new THREE.Group();deb.scale.setScalar(S);deb.position.x=BX;root.add(deb);

/* ---------- pecahan ---------- */
var pcs=[],vc={};
function spawn(c,pos,sx,sy,sz,q,v){
  var k=c+(Math.random()*3|0),mt=vc[k];if(!mt){mt=vc[k]=new THREE.MeshStandardMaterial({color:new THREE.Color(c).offsetHSL(0,0,rnd(-.07,.07)),roughness:.7})}
  var m=new THREE.Mesh(UB,mt);m.scale.set(sx,sy,sz);m.position.copy(pos);m.quaternion.copy(q);deb.add(m);
  pcs.push({m:m,v:v,r:new THREE.Vector3(rnd(-.14,.14),rnd(-.14,.14),rnd(-.14,.14)),h:Math.min(sx,sy,sz)/2});
}
var ID=new THREE.Quaternion(),CEN=new THREE.Vector3(-20,15,0);
function chip(n,power){
  for(var i=0;i<n;i++){var p=new THREE.Vector3(rnd(-35,5),rnd(95,115),rnd(-8,8));
    spawn('#cfd3d6',p,rnd(1.5,3.5),rnd(1.5,3.5),rnd(1.5,3.5),ID,new THREE.Vector3(rnd(-.6,.6)*power,rnd(0,.8),rnd(-.3,.8)*power))}}
function collapse(){
  bld.children.slice().forEach(function(m){
    var g=m.geometry.parameters,sw=g.width*m.scale.x,sh=g.height*m.scale.y,sd=g.depth*m.scale.z;
    var nx=Math.max(1,Math.ceil(sw/8)),ny=Math.max(1,Math.ceil(sh/8)),nz=Math.max(1,Math.ceil(sd/8));
    for(var ix=0;ix<nx;ix++)for(var iy=0;iy<ny;iy++)for(var iz=0;iz<nz;iz++){
      if(nx>2&&nz>2&&ix>0&&ix<nx-1&&iz>0&&iz<nz-1&&iy>0&&iy<ny-1)continue;
      var p=new THREE.Vector3(((ix+.5)/nx-.5)*sw,((iy+.5)/ny-.5)*sh,((iz+.5)/nz-.5)*sd).applyQuaternion(m.quaternion).add(m.position);
      var d=p.clone().sub(CEN);d.y*=.35;d.normalize().multiplyScalar(rnd(.7,3.4));d.y+=rnd(.6,3.4);
      spawn(m.userData.c,p,sw/nx*.96,sh/ny*.96,sd/nz*.96,m.quaternion,d)}
  });
  root.remove(bld);
}
function setDamage(n){bld.traverse(function(m){if(!m.isMesh)return;(Array.isArray(m.material)?m.material:[m.material]).forEach(function(t){t.emissive.setRGB(n*.1,n*.025,0)})})}

/* ledakan 3D */
var fire=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffa030,transparent:true,opacity:0}));fire.position.set(BX-.2,1.4,0);root.add(fire);
var ring=new THREE.Mesh(new THREE.RingGeometry(.9,1.1,48),new THREE.MeshBasicMaterial({color:0xffe0a0,transparent:true,opacity:0,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(BX-.2,.05,0);root.add(ring);
var age=-1;

/* ---------- 2D: kelopak, kembang api ---------- */
var PC=['#ffc2d4','#ff9fbd','#ffe0e8','#ffd7b8','#fff'],P=[],rk=[],pt=[],until=0,last=0;
function newP(x,y,b){return{x:x===undefined?rnd(0,W):x,y:y===undefined?rnd(-20,H):y,z:rnd(.2,1),ph:rnd(0,6.28),rot:rnd(0,6.28),vr:rnd(-.04,.04),fl:rnd(0,6.28),col:PC[Math.random()*5|0],life:b?220:-1,bx:b?rnd(-4,4):0,by:b?rnd(-8,-1):0}}
for(var i=0;i<60;i++)P.push(newP());
function burst(x,y,n){if(P.length>240)return;for(var i=0;i<n;i++)P.push(newP(x+rnd(-20,20),y+rnd(-20,20),true))}
function petals(t){
  bk.clearRect(0,0,W,H);
  for(var i=P.length-1;i>=0;i--){var p=P[i];p.bx*=.96;p.by*=.96;p.y+=.4+p.z*.9+p.by;p.x+=Math.sin(t*.8+p.ph)*.5+p.bx;p.rot+=p.vr;p.fl+=.04;
    if(p.life>0&&--p.life===0){P.splice(i,1);continue}
    if(p.y>H+30){if(p.life>0){P.splice(i,1);continue}p.y=-30;p.x=rnd(0,W)}
    var s=4+p.z*9;bk.save();bk.translate(p.x,p.y);bk.rotate(p.rot);bk.scale(.25+.75*Math.abs(Math.cos(p.fl)),1);bk.globalAlpha=.35+p.z*.5;bk.fillStyle=p.col;bk.beginPath();bk.moveTo(0,-s);bk.bezierCurveTo(s*.9,-s*.6,s*.7,s*.6,0,s);bk.bezierCurveTo(-s*.7,s*.6,-s*.9,-s*.6,0,-s);bk.fill();bk.restore()}
}
function launch(x,ty){rk.push({x:x,y:H,vy:-Math.sqrt(2*.16*(H-ty)),hue:rnd(0,360)})}
function explode(x,y,h){var n=80,kind=Math.random()<.5;for(var i=0;i<n;i++){var a=kind?i/n*6.28:rnd(0,6.28),sp=kind?4.2:rnd(1,5);pt.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.045,f:.985,hue:h+rnd(-25,25),life:1,decay:rnd(.008,.014),sz:rnd(1.6,2.8)})}}
function fxStep(now){
  fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.22)';fx.fillRect(0,0,W,H);fx.globalCompositeOperation='lighter';
  if(now<until&&now-last>420){last=now;launch(rnd(W*.1,W*.9),rnd(H*.1,H*.4))}
  for(var i=rk.length-1;i>=0;i--){var r=rk[i];r.vy+=.16;r.y+=r.vy;fx.fillStyle='hsl('+r.hue+',100%,80%)';fx.beginPath();fx.arc(r.x,r.y,2.2,0,6.28);fx.fill();if(r.vy>=-.6){explode(r.x,r.y,r.hue);boom(false);rk.splice(i,1)}}
  for(i=pt.length-1;i>=0;i--){var p=pt[i];p.vx*=p.f;p.vy=p.vy*p.f+p.g;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.life<=0){pt.splice(i,1);continue}
    fx.fillStyle='hsla('+p.hue+',100%,'+(58+p.life*20)+'%,'+p.life+')';fx.beginPath();fx.arc(p.x,p.y,p.sz*(.5+p.life*.6),0,6.28);fx.fill()}
  fx.globalCompositeOperation='source-over';
}
function scr(){var v=new THREE.Vector3(BX-.2,1.6,0);root.localToWorld(v);v.project(cam);return[(v.x+1)/2*W,(1-v.y)/2*H]}
function word(txt,x,y){var e=document.createElement('div');e.className='word';e.textContent=txt;e.style.left=Math.max(80,Math.min(W-80,x))+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(function(){e.remove()},1900)}

/* ---------- alur ---------- */
var hits=0,state='idle',shk=0,T0=performance.now(),typer=null;
function upd(){hint.textContent=state==='idle'?'Tekan gedungnya 5x ('+hits+' dari 5) 🏢':''; hint.style.opacity=state==='idle'?1:0}
upd();
function tapBld(x,y){
  if(state!=='idle')return;
  hits++;shk=.12+hits*.07;setDamage(hits);chip(hits*3,1.2);boom(false);buzz(30);burst(x,y,14+hits*4);
  word(['Retak!','Goyang…','Mau runtuh!','Sedikit lagi!'][hits-1]||'',x,y-30);
  $('title').classList.add('hide');upd();
  if(hits===5)setTimeout(explodeAll,350);
}
function explodeAll(){
  state='boom';upd();
  var f=$('fl');f.classList.add('on');setTimeout(function(){f.classList.remove('on')},60);
  collapse();age=0;boom(true);buzz([80,40,120]);
  var s=scr();for(var i=0;i<170;i++){var a=rnd(0,6.28),sp=rnd(2,13);pt.push({x:s[0],y:s[1],vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.08,f:.975,hue:rnd(15,50),life:1,decay:rnd(.01,.02),sz:rnd(1.8,3.6)})}
  burst(s[0],s[1],70);
  for(i=0;i<8;i++)(function(d){setTimeout(function(){launch(rnd(W*.1,W*.9),rnd(H*.1,H*.4))},600+d*220)})(i);
  until=performance.now()+7000;
  setTimeout(openLetter,3300);
}
function openLetter(){
  $('letter').classList.add('open');var m=$('msg'),sg=$('sig'),i=0;m.textContent='';sg.classList.remove('on');
  [0,4,7,9].forEach(function(n,k){setTimeout(function(){tone([523,659,784,1046][k],1,.12)},k*140)});
  typer=setInterval(function(){m.textContent=MESSAGE.slice(0,++i);if(i%14===1)tone(440+(i%5)*110,.4,.03,'triangle');if(i>=MESSAGE.length){clearInterval(typer);typer=null;sg.classList.add('on')}},32);
}
$('letter').addEventListener('click',function(e){
  if(e.target.classList.contains('xb')||e.target===this){clearInterval(typer);typer=null;$('letter').classList.remove('open');state='done';$('rp').style.display='block'}
  else if(typer){clearInterval(typer);typer=null;$('msg').textContent=MESSAGE;$('sig').classList.add('on')}
});
$('rp').addEventListener('click',function(){
  while(deb.children.length)deb.remove(deb.children[0]);pcs.length=0;bld=buildUC();root.add(bld);setDamage(0);
  hits=0;state='idle';age=-1;fire.material.opacity=ring.material.opacity=0;T0=performance.now();this.style.display='none';$('title').classList.remove('hide');$('t2').textContent='Tekan lagi gedungnya! 🎓';upd();
});

/* pointer */
var rc=new THREE.Raycaster(),v2=new THREE.Vector2(),drag=false,moved=0,lastX=0,rot=-.5,vel=0,cv=$('gl');
cv.addEventListener('pointerdown',function(e){drag=true;moved=0;lastX=e.clientX;vel=0;ac();music()});
addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lastX;lastX=e.clientX;moved+=Math.abs(dx);vel=dx*.01;rot+=vel});
function end(e){if(!drag)return;drag=false;
  if(e.type==='pointerup'&&moved<10&&state==='idle'){v2.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);rc.setFromCamera(v2,cam);
    if(rc.intersectObject(bld,true).length)tapBld(e.clientX,e.clientY);else burst(e.clientX,e.clientY,8)}}
addEventListener('pointerup',end);addEventListener('pointercancel',end);

/* loop */
function ob(x){if(x<=0)return 0;if(x>=1)return 1;var c=1.70158;x-=1;return 1+(c+1)*x*x*x+c*x*x}
function frame(now){
  var t=now/1000,e=(now-T0)/1000;
  if(!drag){rot+=vel;vel*=.95}
  root.rotation.y=rot+Math.sin(t*.5)*.12;
  if(state==='idle'){var k=Math.max(.001,ob(e/1.1));bld.scale.set(S,S*k,S);shk*=.9;bld.position.x=BX+Math.sin(t*70)*shk*.05;bld.rotation.z=Math.sin(t*55)*shk*.012}
  for(var i=0;i<pcs.length;i++){var p=pcs[i],m=p.m;
    p.v.y-=.085;m.position.add(p.v);m.rotation.x+=p.r.x;m.rotation.y+=p.r.y;m.rotation.z+=p.r.z;
    if(m.position.y<p.h){m.position.y=p.h;p.v.y*=-.3;p.v.x*=.72;p.v.z*=.72;p.r.multiplyScalar(.6);if(Math.abs(p.v.y)<.2){p.v.y=0;p.r.set(0,0,0)}}
  }
  if(age>=0){age++;var a=1-age/50;fire.scale.setScalar(.3+age*.14);fire.material.opacity=Math.max(0,a);fire.material.color.setHSL(.08+.04*a,1,.5+.3*a);var b=1-age/70;ring.scale.setScalar(1+age*.28);ring.material.opacity=Math.max(0,b)}
  ren.render(scene,cam);petals(t);fxStep(now);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
